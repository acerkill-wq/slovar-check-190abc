":"","review":true},{"id":"t072","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":72,"title":"Прочие затраты (сверх стоимости работ)","official":"отдельного определения в нормативных документах нет. Ближайшее: «В главу 9 сводного сметного расчета включается сметная стоимость прочих работ и затрат, не учитываемых в других главах сводного сметного расчета.»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 159.","plain":"затраты, которые не входят в расценку на работу и добавляются в смету отдельно: временные здания и сооружения, зимнее удорожание и другие. В сводном расчёте для них есть свои главы (8 и 9). Резерв считают отдельной строкой после глав 1–12. Сметчики часто называют такие затраты «лимитированными».","example":"затраты на вывоз строительного мусора и зимнее удорожание сметчик показывает в смете отдельными строками.","onwork":"","cta_line":"","review":true},{"id":"t073","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":73,"title":"Временные здания и сооружения","official":"отдельного определения в нормативных документах нет. Ближайшее: «В главу 8 сводного сметного расчета включаются затраты на устройство и ликвидацию временных зданий и сооружений, […]»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 153.","plain":"бытовки, склады, ограждения и другие постройки, нужные только на время стройки. Их ставят и потом убирают, а затраты на это учитывают в главе 8 сводного расчёта. Какие из них считают отдельно, а какие уже заложены в накладные расходы, определяет методика.","example":"на время работ огородили площадку и поставили бытовки: затраты на их устройство и ликвидацию смотрят в главе 8, а долю, уже входящую в накладные расходы, проверяют по методике.","onwork":"","cta_line":"","review":true},{"id":"t074","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":74,"title":"Зимнее удорожание","official":"отдельного определения в нормативных документах нет. Ближайшее: «При разработке нормативов дополнительных затрат, связанных с выполнением работ в зимнее время (далее — НДЗ), учтена совокупность расходов, отражающих особенности выполнения строительных (ремонтно-строительных) работ, работ по монтажу оборудования (монтажных работ) в зимний период (часть года со среднесуточной температурой наружного воздуха ниже 0 °С).»","source_official":"Приказ Минстроя России от 25.05.2021 № 325/пр, п. 2.","plain":"дополнительные затраты на работу в мороз: оттаивание грунта, подогрев, повышенный расход топлива и материалов, снижение производительности. Считается процентом от стоимости работ по нормативу.","example":"бетонируют в январе, и к стоимости работ добавляют зимнее удорожание.","onwork":"","cta_line":"","review":true},{"id":"t075","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":75,"title":"Резерв на непредвиденные работы и затраты","official":"«Резерв средств на непредвиденные работы и затраты предназначен для возмещения стоимости работ и затрат, потребность в которых возникает: а) в процессе разработки рабочей документации; б) в ходе строительства в результате уточнения проектных решений и (или) условий строительства, предусмотренных проектной документацией; […]»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 179.","plain":"запас в сводном расчёте на непредвиденные работы и затраты, которые выясняются уже при разработке рабочей документации или на стройке. Его считают от итога глав 1–12 отдельной строкой, размер ограничен потолком в процентах, который зависит от типа объекта. Для госзаказа действуют отдельные правила его использования.","example":"под стяжкой нашли старую трубу, которой не было в проекте: такие находки закрывают из резерва.","onwork":"","cta_line":"","review":true},{"id":"t076","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":76,"title":"НДС","official":"«За итогом сводного сметного расчета приводится сумма НДС, принимаемого в размере, установленном законодательством Российской Федерации.»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 180.","plain":"налог на добавленную стоимость; с 1 января 2026 года основная ставка 22 %. В сводном расчёте его считают в конце, от итога глав вместе с резервом, а в локальной смете по Методике 421/пр НДС не показывают.","example":"итог без НДС 100 млн ₽, НДС 22 млн ₽, всего 122 млн ₽ (условный пример).","onwork":"","cta_line":"","review":true,"hint":"НДС 22 %: единственная «живая» ставка в тексте. Подтверждаете?"},{"id":"c6_1","type":"remember","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"title":"Плашка «Запомните»","text":"**Запомните.** Накладные расходы и сметная прибыль считаются от ФОТ. Именно поэтому ФОТ называют «основой» для двух больших слагаемых сметы.","review":true},{"id":"end6","type":"section_end","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"title":"Конец раздела 6: фраза «Как это слово звучит на работе»","onwork":"Коллега просит: «Проверь, от какого ФОТ посчитаны НР и СП, а то итог не сходится».","cta_line":"*Покажем, как это слово работает в смете: эфир «Быстрый старт 2026», [КОРОТКАЯ_ССЫЛКА]*","review":true},{"id":"sec7","type":"section","section":"Раздел 7. Приёмка работ и оплата","number":7,"title":"Приёмка работ и оплата","text":"*Как выполненная работа превращается в подписанный акт и оплату.* Термины 77–88","review":false},{"id":"t077","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":77,"title":"Сметная стоимость","official":"«расчетная стоимость строительства, реконструкции, капитального ремонта, сноса объектов капитального строительства, работ по сохранению объектов культурного наследия, подлежащая определению на этапе архитектурно-строительного проектирования, подготовки сметы на снос объекта капитального строительства и применению в соответствии со статьей 8.3 настоящего Кодекса»","source_official":"ГрК РФ, ст. 1, п. 30.","plain":"стоимость строительства, рассчитанная по нормам и ценам из официальной базы. Это ориентир для заказа, а договорная цена может быть другой.","example":"по нормам и ценам базы ремонт школы оценили в 5 млн ₽: это ориентир для заказа (условный пример).","onwork":"","cta_line":"","review":true,"hint":"Для этого слова вместо «определения нет» взята цитата из нормативного документа. Согласны ли Вы с таким решением? Подходит ли она для новичка?"},{"id":"t078","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":78,"title":"Договорная цена","official":"такого термина в Гражданском кодексе нет. Ближайшее: «В договоре подряда указываются цена подлежащей выполнению работы или способы ее определения.»","source_official":"ГК РФ, ст. 709, п. 1.","plain":"цена, о которой договорились заказчик и подрядчик и которая записана в договоре.","example":"сметная стоимость 5 млн ₽, а в договоре записали 4,6 млн ₽: это и есть договорная цена (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t079","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":79,"title":"Твёрдая цена","official":"«Цена работы (смета) может быть приблизительной или твердой. При отсутствии других указаний в договоре подряда цена работы считается твердой.»","source_official":"ГК РФ, ст. 709, п. 4.","plain":"цена, которая не меняется, пока идут работы. Без отдельной оговорки подряд считается с твёрдой ценой; менять её можно только в случаях, прямо предусмотренных договором или законом.","example":"в договоре записано 4,6 млн ₽, и эта сумма не пересматривается по ходу работ, пока договор не предусматривает иное (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t080","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":80,"title":"Договор подряда","official":"«По договору подряда одна сторона (подрядчик) обязуется выполнить по заданию другой стороны (заказчика) определенную работу и сдать ее результат заказчику, а заказчик обязуется принять результат работы и оплатить его.»","source_official":"ГК РФ, ст. 702, п. 1.","plain":"договор, по которому подрядчик выполняет работу, а заказчик принимает её и оплачивает. В нём записывают, что делают, в какие сроки и за какую цену; смету обычно прикладывают к договору, и она служит основой цены.","example":"подрядчик по договору красит фасад за согласованную цену, а смета лежит в приложении.","onwork":"","cta_line":"","review":true},{"id":"t081","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":81,"title":"Смета контракта","official":"«Смета контракта является основанием для формирования первичных учетных документов […] в том числе используемых для расчетов между заказчиком и подрядчиком за выполненные работы»","source_official":"Приказ Минстроя России от 23.12.2019 № 841/пр, прил. 2, п. 7.","plain":"смета, на основе которой заключают и оплачивают госконтракт на строительство или реконструкцию. Её составляют по отдельной методике (приказ Минстроя № 841/пр). Путь выглядит так: смета → НМЦК → смета контракта → акт.","example":"торги закончились, цену контракта записали, и смету контракта составляют в пределах этой цены.","onwork":"","cta_line":"","review":true,"hint":"Охватывает ли Методика 841/пр капитальный ремонт? В тексте сказано только «строительство или реконструкция». Верна ли цитата (прил. 2, п. 7)?"},{"id":"t082","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":82,"title":"Акт КС-2","official":"«Применяется для приемки выполненных подрядных строительно-монтажных работ производственного, жилищного, гражданского и других назначений.»","source_official":"Постановление Госкомстата России от 11.11.1999 № 100, форма № КС-2.","plain":"акт, в котором подрядчик и заказчик подписывают, что сделано и в каком объёме за период. Форму когда-то утвердил Госкомстат; обязательной она не является, а применяется по договору и на практике.","example":"в КС-2 за октябрь записано: уложено 200 м² плитки и 120 м² штукатурки (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t083","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":83,"title":"Справка КС-3","official":"«Применяется для расчетов с заказчиком за выполненные работы.»","source_official":"Постановление Госкомстата России от 11.11.1999 № 100, форма № КС-3.","plain":"справка о стоимости выполненных работ. Её составляют по КС-2: в ней итоговые суммы за период и с начала стройки. По ней заказчик оплачивает работы.","example":"в КС-3 за октябрь стоят сумма за месяц и сумма с начала стройки, и заказчик платит по этой справке.","onwork":"","cta_line":"","review":true},{"id":"t084","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":84,"title":"Процентовка","official":"отдельного определения в нормативных документах нет; термин используется на практике.","source_official":"","plain":"разговорное название расчёта выполненных работ в процентах от сметы, а часто и самих КС-2 и КС-3, по которым платят. В законах такого слова нет.","example":"«Подпишем процентовку за октябрь» значит: закроем акты за месяц.","onwork":"","cta_line":"","review":true},{"id":"t085","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":85,"title":"Скрытые работы","official":"«освидетельствование работ, скрываемых последующими работами (далее — скрытые работы)»","source_official":"Постановление Правительства РФ от 21.06.2010 № 468, п. 5.","plain":"работы, которые потом закроют другими: армирование, гидроизоляция, проводка в стенах. Принимают их до закрытия; какие именно работы относятся к скрытым, определяет проект.","example":"гидроизоляцию фундамента засыпают грунтом, поэтому её принимают до засыпки.","onwork":"","cta_line":"","review":true},{"id":"t086","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":86,"title":"Акт освидетельствования скрытых работ (АОСР)","official":"в нормативных документах отдельного определения нет. Ближайшее: в состав исполнительной документации входят «Акты освидетельствования скрытых работ (рекомендуемый образец приведен в приложении № 3 к настоящему составу).»","source_official":"Приказ Минстроя России от 16.05.2023 № 344/пр, прил. 1.","plain":"акт, которым представители застройщика или технического заказчика, подрядчика и исполнителя работ подтверждают, что скрытые работы выполнены по проекту и конструкцию можно закрывать.","example":"проводку в стене проверили и подписали АОСР, а потом стену заштукатурили.","onwork":"","cta_line":"","review":true},{"id":"t087","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":87,"title":"Исполнительная документация","official":"отдельного определения в нормативных документах нет. Ближайшее: «Ведение исполнительной документации при строительстве, реконструкции, капитальном ремонте объектов капитального строительства (далее — исполнительная документация) по решению застройщика, технического заказчика […] осуществляется на бумажном носителе или в форме электронных документов […]»","source_official":"Приказ Минстроя России от 16.05.2023 № 344/пр, прил. 2, п. 1.","plain":"документы, которые показывают, как работы выполнены на самом деле: акты, схемы, журналы.","example":"журнал бетонных работ и схема укладки арматуры — исполнительная документация.","onwork":"","cta_line":"","review":true},{"id":"t088","type":"term","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"number":88,"title":"Дополнительные работы","official":"в нормативных документах отдельного определения нет. Ближайшее: «Подрядчик, обнаруживший в ходе строительства не учтенные в технической документации работы и в связи с этим необходимость проведения дополнительных работ и увеличения сметной стоимости строительства, обязан сообщить об этом заказчику.»","source_official":"ГК РФ, ст. 743, п. 3.","plain":"работы, которых не было в первоначальной смете. Подрядчик обязан сообщить о них заказчику, а в смету их добавляют по согласованию; в госзаказе это возможно только в случаях, которые разрешает закон.","example":"под полом нашли гниль и вырезали её: этих работ не было в смете, и подрядчик сообщает о них заказчику, чтобы согласовать изменение.","onwork":"","cta_line":"","review":true},{"id":"c7_1","type":"remember","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"title":"Плашка «Запомните»","text":"**Запомните.** КС-2 отвечает на вопрос «что сделано», КС-3 — на вопрос «сколько за это платить». Обычно подписывают их вместе.","review":true},{"id":"c7_2","type":"mistake","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"title":"Плашка «Типичная ошибка новичка»","text":"**Типичная ошибка новичка.** Обычно путают КС-2 и КС-3: акт описывает работы и объёмы, а справка показывает деньги. Подписать одно без другого — значит оставить расчёт неполным.","review":true},{"id":"end7","type":"section_end","section":"Раздел 7. Приёмка работ и оплата","section_number":7,"title":"Конец раздела 7: фраза «Как это слово звучит на работе»","onwork":"Начальник говорит: «Закрой процентовку по октябрю: КС-2 и КС-3 нужны до пятницы».","cta_line":"*Покажем, как это слово работает в смете: эфир «Быстрый старт 2026», [КОРОТКАЯ_ССЫЛКА]*","review":true},{"id":"sec8","type":"section","section":"Раздел 8. Закупки и проверка смет","number":8,"title":"Закупки и проверка смет","text":"*Где смета выходит за пределы офиса: торги, экспертиза, проверка.* Термины 89–98","review":false},{"id":"t089","type":"term","section":"Раздел 8. Закупки и проверка смет","section_number":8,"number":89,"title":"Госзакупки","official":"термина «госзакупки» в законе нет. Ближайшее: «закупка товара, работы, услуги для обеспечения государственных или муниципальных нужд (далее — закупка) — совокупность действий, осуществляемых в установленном настоящим Федеральным законом порядке заказчиком и направленных на обеспечение государственных или муниципальных нужд»","source_official":"Федеральный закон от 05.04.2013 № 44-ФЗ, ст. 3, п. 3.","plain":"разговорное название закупок работ и услуг для государственных и муниципальных нужд по закону о контрактной системе (44-ФЗ): конкурсом, аукционом, запросом котировок или, в случаях, которые прямо перечислены в законе, у единственного поставщика.","example":"администрация города выбирает подрядчика на ремонт моста через электронный конкурс.","onwork":"","cta_line":"","review":true},{"id":"t090","type":"term","section":"Раздел 8. Закупки и проверка смет","section_number":8,"number":90,"title":"44-ФЗ","official":"Федеральный закон от 05.04.2013 № 44-ФЗ «О контрактной системе в сфере закупок товаров, работ, услуг для обеспечения государственных и муниципальных нужд»; закон «регулирует отношения, направленные на обеспечение государственных и муниципальных нужд в целях повышения эффективности, результативности осуществления закупок товаров, работ, услуг, обеспечения гласности и прозрачности осуществления таких закупок, предотвращения коррупции и других злоупотреблений в сфере таких закупок»","source_official":"44-ФЗ, ст. 1, ч. 1.","plain":"закон о контрактной системе в сфере закупок для государственных и муниципальных нужд. По нему закупают бюджетные организации.","example":"школа на бюджетные деньги закупает ремонт кровли по правилам 44-ФЗ.","onwork":"","cta_line":"","review":true},{"id":"t091","type":"term","section":"Раздел 8. Закупки и проверка смет","section_number":8,"number":91,"title":"223-ФЗ","official":"Федеральный закон от 18.07.2011 № 223-ФЗ «О закупках товаров, работ, услуг отдельными видами юридических лиц»; закон «устанавливает общие принципы закупки товаров, работ, услуг и основные требования к закупке товаров, работ, услуг: 1) государственными корпорациями, государственными компаниями, публично-правовыми компаниями, субъектами естественных монополий, […]»","source_official":"223-ФЗ, ст. 1, ч. 2.","plain":"закон о закупках отдельных видов юридических лиц: госкорпораций, госкомпаний, естественных монополий и других. Правила закупок у каждого заказчика свои, они прописаны в его положении о закупке.","example":"госкорпорация закупает работы по своему положению о закупке, которое составлено по 223-ФЗ.","onwork":"","cta_line":"","review":true},{"id":"t092","type":"term","section":"Раздел 8. Закупки и проверка смет","section_number":8,"number":92,"title":"Тендер (торги)","official":"термина «тендер» в законе нет. Ближайшее: «Конкурентными способами являются: 1) конкурсы […] 2) аукционы […] 3) запрос котировок в электронной форме»","source_official":"44-ФЗ, ст. 24, ч. 2.","plain":"разговорное слово для конкурентной закупки: подрядчики предлагают свои условия, а победителя определяют по правилам выбранного способа. В аукционе выигрывает предложивший наименьшую цену, в конкурсе — лучшие условия исполнения контракта. Смета служит основой начальной цены.","example":"три подрядчика подали заявки на ремонт поликлиники, и контракт получил тот, кто лучше всех подошёл под условия конкурса.","onwork":"","cta_line":"","review":true},{"id":"t093","type":"term","section":"Раздел 8. Закупки и проверка смет","section_number":8,"number":93,"title":"НМЦК","official":"закон определения НМЦК не даёт, а описывает порядок. Ближайшее, для стройки: «НМЦК при осуществлении закупки подрядных работ по строительству, реконструкции, капитальному ремонту, сносу объекта капитального строительства определяется на основании проектной документации […] проектно-сметным методом исходя из сметной стоимости строительства […]»","source_official":"Приказ Минстроя России от 23.12.2019 № 841/пр, прил. 1, п. 5.","plain":"начальная (максимальная) цена контракта: максимальная цена, которую заказчик готов заплатить. Для стройки её считают по смете, и это одна из важных задач сметчика заказчика.","example":"по смете проекта заказчик посчитал НМЦК ремонта поликлиники: предложения выше этой цены на торгах не принимают.","onwork":"","cta_line":"","review":true},{"id":"t094","type":"term","section":"Раздел 8. Закупки и проверка смет","section_number":8,"number":94,"title":"Проектно-сметный метод","official":"«Определение начальной (максимальной) цены контракта, […] предметом которых являются строительство, реконструкция, капитальный ремонт, снос объектов капитального строительства, […] с использованием проектно-сметного метода осуществляется в порядке, установленном настоящим Федеральным законом, исходя из сметной стоимости строительства, реконструкции, капитального ремонта объектов капитального строительства, […]»","source_official":"44-ФЗ, ст. 22, ч. 9.2.","plain":"способ обосновать НМЦК на строительство, реконструкцию, капремонт и снос: цену берут из сметы проекта и пересчитывают с учётом инфляции. Для текущего ремонта заказчик вправе применять его тоже.","example":"смета проекта составлена на прошлый год, и перед закупкой её пересчитывают с учётом инфляции.","onwork":"","cta_line":"","review":true},{"id":"t095","type":"term","section":"Раздел 8. Закупки и проверка смет","section_number":8,"number":95,"title":"Государственная экспертиза","official":"в нормативных документах отдельного определения нет. Ближайшее: «Экспертиза проектной документации и (или) экспертиза результатов инженерных изысканий проводятся в форме государственной экспертизы или негосударственной экспертизы.»","source_official":"ГрК РФ, ст. 49, ч. 1.","plain":"проверка проекта и сметы государственной экспертной организацией. Обязательна для многих объектов, в том числе для объектов на бюджетные деньги.","example":"проект школы на бюджетные деньги прошёл государственную экспертизу: замечания вернулись списком, и их исправили.","onwork":"","cta_line":"","review":true},{"id":"t096","type":"term","section":"Раздел 8. Закупки и проверка смет","section_number":8,"number":96,"title":"Проверка достоверности сметной стоимости","official":"«[…] превышает десять миллионов рублей, указанная сметная стоимость строительства подлежит проверке на предмет достоверности ее определения в ходе проведения государственной экспертизы проектной документации.»","source_official":"ГрК РФ, ст. 8.3, ч. 2.","plain":"часть экспертизы: эксперт проверяет, достоверно ли определена сметная стоимость строительства. Для строек на бюджетные деньги со сметой выше 10 млн ₽ такая проверка идёт в ходе государственной экспертизы проекта.","example":"эксперт нашёл, что в смете применена норма не на тот вид работ, и вернул смету на доработку.","onwork":"","cta_line":"","review":true},{"id":"t097","type":"term","section":"Раздел 8. Закупки и проверка смет","section_number":8,"number":97,"title":"Проверка (аудит) сметы","official":"отдельного определения в нормативных документах нет; термин используется на практике.","source_official":"","plain":"анализ сметы на ошибки и завышения. Это не процедура по закону, а рабочая практика: сметчик делает проверку для заказчика, для подрядчика или перед сдачей на экспертизу.","example":"перед сдачей сметчик перечитал смету по списку проверки и нашёл, что плитка посчитана дважды.","onwork":"","cta_line":"","review":true},{"id":"t098","type":"term","section":"Раздел 8. Закупки и проверка смет","section_number":8,"number":98,"title":"КПСР","official":"отдельного определения в нормативных документах нет; термин используется на практике.","source_official":"","plain":"сервис комплексной проверки сметных расчётов, который создала Главгосэкспертиза. В нём комплект смет можно проверить до подачи на экспертизу.","example":"перед отправкой на экспертизу сметчик загружает комплект в КПСР и исправляет найденные замечания заранее.","onwork":"","cta_line":"","review":true,"hint":"КПСР: «сервис создала Главгосэкспертиза, комплект смет можно проверить до подачи на экспертизу». Подтвердите название и описание сервиса."},{"id":"c8_1","type":"remember","section":"Раздел 8. Закупки и проверка смет","section_number":8,"title":"Плашка «Запомните»","text":"**Запомните.** Экспертиза — это профессиональная проверка, а не приговор. Типичные замечания известны заранее, и значит, их можно исправить до подачи.","review":true},{"id":"c8_2","type":"mistake","section":"Раздел 8. Закупки и проверка смет","section_number":8,"title":"Плашка «Типичная ошибка новичка»","text":"**Типичная ошибка новичка.** Обычно путают 44-ФЗ и 223-ФЗ: первый — закон о закупках государственных и муниципальных заказчиков, второй — о закупках отдельных видов юридических лиц, у каждого из которых свои правила в положении о закупке.","review":true},{"id":"end8","type":"section_end","section":"Раздел 8. Закупки и проверка смет","section_number":8,"title":"Конец раздела 8: фраза «Как это слово звучит на работе»","onwork":"Заказчик просит: «НМЦК обоснуйте проектно-сметным методом и приложите смету».","cta_line":"*Покажем, как это слово работает в смете: эфир «Быстрый старт 2026», [КОРОТКАЯ_ССЫЛКА]*","review":true},{"id":"sec9","type":"section","section":"Раздел 9. Инструменты сметчика","number":9,"title":"Инструменты сметчика","text":"*Чем считают сметчики.* Термины 99–100","review":false},{"id":"t099","type":"term","section":"Раздел 9. Инструменты сметчика","section_number":9,"number":99,"title":"Сметная программа","official":"отдельного определения в нормативных документах нет; термин используется на практике.","source_official":"","plain":"программа, в которой составляют сметы: нормы и цены уже внутри, расчёты идут автоматически. Ответственность за результат остаётся на сметчике, поэтому начинающему полезно хотя бы раз посчитать вручную и понять, как получается итог.","example":"сметчик выбрал норму и ввёл объём, программа сама посчитала итог, а проверяет итог человек.","onwork":"","cta_line":"","review":true},{"id":"t100","type":"term","section":"Раздел 9. Инструменты сметчика","section_number":9,"number":100,"title":"ГРАНД-Смета","official":"в нормативных документах определения нет, это коммерческая программа. Описание разработчика: «Программа „ГРАНД-Смета“ предназначена для автоматизации определения сметной стоимости строительства и учета выполненных работ.» — сайт разработчика, страница программы «ГРАНД-Смета».","source_official":"","plain":"сметная программа, основной инструмент учебного курса КНС. В ней сметчик собирает смету из норм, цен и объёмов.","example":"сметчик вводит объёмы, программа подставляет нормы и цены и собирает локальную смету.","onwork":"Начальник говорит: «Пересчитай в ГРАНД-Смете и сверь итог с ручной прикидкой».","cta_line":"*Покажем, как это слово работает в смете: эфир «Быстрый старт 2026», [КОРОТКАЯ_ССЫЛКА]*","review":true,"hint":"«Основной инструмент учебного курса КНС»: так ли это на самом деле? Это сведения о курсе, а не официальное описание программы."},{"id":"final","type":"final","section":"Финал","title":"Что дальше?","text":"Помните файл из начала словаря, где стояли ГЭСН, ВОР, КС-2, НР, СП, и было непонятно, с какого слова начинать? Откройте его снова. Теперь Вы видите, где норма, где объём, где акт и откуда берётся итог.\n\nСлово Вы узнали, на эфире увидите его в работе. На **«Быстром старте 2026»** эксперты Академии на экране соберут строку сметы из терминов ВОР → ГЭСН → шифр → НР. Покажут, где новички ошибаются чаще всего: путают измеритель — берут объём в метрах, а норма дана на 100 м². И расскажут, как освоить профессию без строительного образования.\n\n**[ДАТА_ВРЕМЯ]**\n\n**Записаться на эфир:** [ССЫЛКА_С_UTM]\n\nМы справимся.","review":true},{"id":"about","type":"about","section":"Об Академии","title":"Об Академии","text":"**Академия Сметного Дела (АСД)** — онлайн-обучение сметчиков. Мы учим тех, кто приходит в профессию с нуля, и помогаем действующим специалистам расти и держать знания в актуальном состоянии: от основ сметного дела до продвинутых методов и годового сопровождения в профессиональном сообществе.\n\nЗанятия ведут эксперты-практики. Во главе Академии — **Фирая Ярхамовна Валиева**, руководитель и главный эксперт. Среди преподавателей — Инна Митрофанова и другие специалисты с большим стажем работы в сметном деле.\n\nУ Академии есть образовательная лицензия. Выпускники получают удостоверение о повышении квалификации с внесением в ФИС ФРДО.\n\n**Сайт:** academia-bti.ru\n**Телефон:** 8-800-350-46-82\n**Email:** info@academia-bti.ru\n**Работаем:** ежедневно с 9:00 до 21:00 по Москве","review":true}],"sections":[{"n":1,"name":"Профессия и участники стройки"},{"n":2,"name":"Проект и исходные документы"},{"n":3,"name":"Виды смет"},{"n":4,"name":"Нормативы: на что опирается сметчик"},{"n":5,"name":"Методы расчёта и цены"},{"n":6,"name":"Из чего состоит стоимость"},{"n":7,"name":"Приёмка работ и оплата"},{"n":8,"name":"Закупки и проверка смет"},{"n":9,"name":"Инструменты сметчика"}]};/*DATA_END*/

const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const lsDel = k => { try { localStorage.removeItem(k); } catch(e){} };
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function md(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+?)\*(?!\*)/g,"$1<i>$2</i>")
    .replace(/\[([A-ZА-ЯЁ_]{4,})\]/g,'<mark>[$1]</mark>').replace(/\n/g,"<br>");
}
const blocks = (BOOK && BOOK.blocks) || [];
const REVIEW = blocks.filter(b=>b.review);
const N = REVIEW.length;
let state = {name:"", answers:{}, sent:0, pos:0};   // answers[id] = {v, text, source}
let view = "start";                                  // start | block | list | send
let confirmNext = false;
let cid = lsGet(LS.cid) || (Date.now().toString(36)+Math.random().toString(36).slice(2,8));
lsSet(LS.cid, cid);

/* размер шрифта */
let fs = parseInt(lsGet(LS.fs)||"22",10); if(!(fs>=18&&fs<=34)) fs=22;
function setFs(v){ fs=Math.max(18,Math.min(34,v)); document.documentElement.style.fontSize=fs+"px"; lsSet(LS.fs,String(fs)); }
setFs(fs);
$("fsDown").onclick=()=>setFs(fs-2); $("fsUp").onclick=()=>setFs(fs+2); $("fsMid").onclick=()=>setFs(22);

/* черновик */
function loadDraft(){
  try{ const d = JSON.parse(lsGet(LS.draft)||"null"); if(d && d.answers) state = Object.assign(state, d); }catch(e){}
  if(!(state.pos>=0 && state.pos<N)) state.pos=0;
}
let saveT=null;
function saveDraft(){ clearTimeout(saveT); saveT=setTimeout(()=>lsSet(LS.draft, JSON.stringify(state)),250); }
function flushDraft(){ clearTimeout(saveT); lsSet(LS.draft, JSON.stringify(state)); }
window.addEventListener("pagehide", flushDraft);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) flushDraft(); });

/* ===== вход ===== */
async function authFetch(path, body){
  const r = await fetch(SUPABASE_URL.replace(/\/$/,"")+path, {method:"POST",
    headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.msg||"auth");
  return j;
}
function saveSess(j){ lsSet(LS.sess, JSON.stringify({access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now()+(j.expires_in||3600)*1000-60000})); }
async function getToken(){
  let s; try{ s=JSON.parse(lsGet(LS.sess)||"null"); }catch(e){}
  if(!s) return null;
  if(Date.now() < s.expires_at) return s.access_token;
  try{ const j = await authFetch("/auth/v1/token?grant_type=refresh_token",{refresh_token:s.refresh_token}); saveSess(j); return j.access_token; }
  catch(e){ lsDel(LS.sess); return null; }
}
function showApp(on){
  $("login").classList.toggle("hidden",on); $("app").classList.toggle("hidden",!on);
  if(on){ view="start"; render(); }
}
$("demoNote").classList.toggle("hidden",!DEMO);
$("loginForm").addEventListener("submit", async e=>{
  e.preventDefault(); $("loginErr").textContent="";
  const p = $("pass").value; if(!p){ $("loginErr").textContent="Введите пароль."; return; }
  if(DEMO){ lsSet(LS.sess, JSON.stringify({demo:true,expires_at:Date.now()+864e5})); showApp(true); return; }
  $("btnLogin").disabled=true;
  try{ const j = await authFetch("/auth/v1/token?grant_type=password",{email:LOGIN_EMAIL,password:p}); saveSess(j); $("pass").value=""; showApp(true); }
  catch(err){ $("loginErr").textContent="Не получилось войти. Проверьте пароль."; }
  $("btnLogin").disabled=false;
});

/* ===== вспомогательное ===== */
function status(id){ const a=state.answers[id]; return a&&a.v?a.v:"none"; }
function counts(){ const c={all:N,none:0,ok:0,bad:0,unsure:0}; REVIEW.forEach(b=>{c[status(b.id)]++;}); return c; }
const KIND = {term:"Термин",quickstart:"Быстрый старт",quiz:"Квиз",quiz_result:"Квиз, итог",remember:"Плашка «Запомните»",mistake:"Плашка «Типичная ошибка новичка»",callout:"Плашка",cta:"Приглашение",final:"Финал",about:"Об Академии",intro:"Вступление",section_end:"Конец раздела"};
function counter(b){
  if(b.type==="term") return `Термин ${b.number} из 100`;
  if(b.type==="quickstart") return `Быстрый старт, слово ${b.number} из 10`;
  if(b.type==="quiz") return `Квиз, вопрос ${b.number} из 5`;
  return KIND[b.type]||"Блок";
}
function resumeText(b){ return b.type==="term" ? `Продолжить с термина ${b.number}` : `Продолжить с блока «${b.title.replace(/\*+/g,"")}»`; }
function fld(label,val,cls){ return val?`<div class="fld ${cls||""}"><div class="fl">${label}</div><div class="fv">${md(val)}</div></div>`:""; }
function cardBody(b){
  switch(b.type){
    case "term": return officialBox(b)+box("pl","Простыми словами",b.plain)+box("ex","Пример",b.example)+fld("Как это слово звучит на работе",b.onwork)+fld("Строка-приглашение",b.cta_line);
    case "quickstart": return box("pl","Простыми словами",b.plain)+fld("В словаре","термин № "+b.term_ref);
    case "quiz": return fld("Вопрос",b.question)+fld("Варианты",b.options)+fld("Правильный ответ",b.answer_letter+". "+b.answer_text);
    case "section_end": return fld("Как это слово звучит на работе",b.onwork)+fld("Строка-приглашение",b.cta_line);
    case "intro": return fld("Текст",b.text)+fld("Плашка",b.callout);
    default: return fld("Текст",b.text);
  }
}
function box(cls,label,val){ if(val&&cls!=="off") val=val.charAt(0).toUpperCase()+val.slice(1); return val?`<div class="box ${cls}"><div class="bl">${label}</div><div class="fv">${md(val)}</div></div>`:""; }
function officialBox(b){
  const q=!!b.source_official;
  return `<div class="box off"><div class="bl">Официальное определение</div><div class="fv ${q?"quote":""}">${md(b.official)}</div>${q?`<div class="src">Источник: ${esc(b.source_official.replace(/\.$/,""))}</div>`:""}</div>`;
}
const PARTS = ["Официальное определение","Простыми словами","Пример","Всё сразу"];
const VLAB = {ok:"Принимаю", bad:"Не принимаю", unsure:"Нужно уточнить"};
function panelHTML(b,a){
  const bad = a.v==="bad";
  return `<div class="panel">
    <h2>${bad?"Как должно быть? Напишите или надиктуйте":"Что нужно уточнить? Напишите или надиктуйте"}</h2>
    ${b.type==="term"?`<fieldset class="part"><legend>${bad?"Что именно неверно:":"Что именно вызывает сомнение:"}</legend>${PARTS.map((p,i)=>`<label class="${a.part===p?"on":""}"><input type="radio" name="part" value="${i}" ${a.part===p?"checked":""}>${p}</label>`).join("")}</fieldset>`:""}
    <textarea class="f" id="ta" rows="6" aria-label="Ваш текст">${esc(a.text||"")}</textarea>
    <button type="button" class="mic" id="mic">🎤 Надиктовать</button>
    <div class="mic-note hidden" id="micNote" role="status"></div>
    <div class="src"><label class="lbl" for="src">На какой документ опираетесь (необязательно)</label>
    <input class="f" id="src" placeholder="Например, Методика 421/пр, п. 63" value="${esc(a.source||"")}"></div>
  </div>`;
}

/* ===== экраны ===== */
function setTop(c1,c2){
  const c=counts(), done=N-c.none;
  $("cnt").textContent=c1; $("prog").textContent=`Проверено: ${done} из ${N}`;
  $("pBar").style.width=(N?done/N*100:0)+"%";
}
function render(){
  stopMic();
  const sc=$("screen"); let c=counts();
  if(!N){ sc.innerHTML='<p class="title2">Данные не загружены.</p>'; return; }
  if(view==="start") return renderStart(sc,c);
  if(view==="list") return renderList(sc);
  if(view==="send") return renderSend(sc,c);
  renderBlock(sc);
}
function renderStart(sc,c){
  setTop("Добро пожаловать","");
  const done=N-c.none, cur=REVIEW[state.pos];
  sc.innerHTML=`<h1 class="title2">Как работать</h1>
   <div class="q" style="margin-top:0"><p>Перед вами по одному блоку словаря. Прочитайте его и нажмите одну из кнопок под текстом:</p>
   <p style="margin-top:10px"><b>«Принимаю»</b> — всё верно.<br><b>«Не принимаю»</b> — что-то неверно: напишите или надиктуйте, как должно быть.<br><b>«Нужно уточнить»</b> — сомневаетесь.</p>
   <p style="margin-top:10px">Всего блоков: ${N}. Всё, что вы отметили, сохраняется само: можно закрыть страницу и вернуться позже.</p></div>
   <div class="nav" style="flex-direction:column">${done>0?`<button class="big dark" id="goResume" type="button">${esc(resumeText(cur))}</button><button class="big" id="goFirst" type="button">Начать с первого блока</button>`:`<button class="big dark" id="goFirst" type="button">Начать</button>`}</div>`;
  if($("goResume")) $("goResume").onclick=()=>go(state.pos);
  $("goFirst").onclick=()=>go(0);
}
function go(i){ state.pos=Math.max(0,Math.min(N-1,i)); view="block"; confirmNext=false; flushDraft(); render(); window.scrollTo(0,0); }
function renderBlock(sc){
  const b=REVIEW[state.pos], a=state.answers[b.id]||{}, v=a.v||"";
  setTop(counter(b));
  const sub = b.section && b.section!==KIND[b.type] && b.type!=="term" ? "" : "";
  sc.innerHTML=`<article class="q">
      <div class="kind">${esc(b.type==="term"||b.type==="quickstart"||b.type==="quiz"?(b.section||""):(b.section&&b.section!==counter(b)?b.section:""))}</div>
      <h1>${md(b.title)}</h1>
      ${cardBody(b)}
      ${b.hint?`<div class="hint"><b>Просим проверить именно это:</b><br>${md(b.hint)}</div>`:""}
    </article>
    <section class="a" aria-label="Ваш ответ">
      <div class="lead">${v?"Ваш ответ:":"Ваш ответ на этот блок:"}</div>
      <button type="button" class="v ok ${v==="ok"?"on":""}" data-v="ok">${v==="ok"?"✓ Вы выбрали: Принимаю":"✓ ПРИНИМАЮ"}</button>
      <button type="button" class="v bad ${v==="bad"?"on":""}" data-v="bad">${v==="bad"?"✗ Вы выбрали: Не принимаю":"✗ НЕ ПРИНИМАЮ"}</button>
      <button type="button" class="v unsure ${v==="unsure"?"on":""}" data-v="unsure">${v==="unsure"?"Вы выбрали: Нужно уточнить":"Нужно уточнить"}</button>
      ${v==="bad"||v==="unsure"?panelHTML(b,a):""}
    </section>
    <div class="nav">
      <button type="button" class="big" id="bBack" ${state.pos===0?"disabled style='opacity:.45'":""}>← Назад</button>
      <button type="button" class="big dark" id="bNext">${state.pos===N-1?"Далее: отправка →":"Далее →"}</button>
    </div>
    <div class="soft ${confirmNext?"":"hidden"}" id="warn" role="alert"><b>Вы не выбрали ответ. Перейти дальше без ответа?</b>
      <div class="row"><button type="button" class="big small" id="wStay">Остаться и ответить</button><button type="button" class="big small dark" id="wGo">Перейти дальше без ответа</button></div></div>
    <div class="foot"><button type="button" class="link" id="fList">Список блоков</button></div>`;
  sc.querySelectorAll(".v").forEach(x=>x.onclick=()=>pick(b,x.dataset.v));
  $("bBack").onclick=()=>{ if(state.pos>0) go(state.pos-1); };
  $("bNext").onclick=()=>{
    if(!status(b.id).replace("none","")){ confirmNext=true; $("warn").classList.remove("hidden"); $("warn").scrollIntoView({block:"center"}); return; }
    advance();
  };
  $("wStay").onclick=()=>{ confirmNext=false; $("warn").classList.add("hidden"); };
  $("wGo").onclick=()=>advance();
  $("fList").onclick=()=>{ view="list"; render(); window.scrollTo(0,0); };
  if(v==="bad"||v==="unsure"){
    sc.querySelectorAll('input[name="part"]').forEach(r=>r.addEventListener("change",()=>{ (state.answers[b.id]=state.answers[b.id]||{}).part=PARTS[+r.value]; sc.querySelectorAll(".part label").forEach(l=>l.classList.toggle("on",l.contains(r)&&r.checked)); saveDraft(); }));
    $("ta").addEventListener("input",e=>{ (state.answers[b.id]=state.answers[b.id]||{}).text=e.target.value; saveDraft(); });
    $("src").addEventListener("input",e=>{ (state.answers[b.id]=state.answers[b.id]||{}).source=e.target.value; saveDraft(); });
    $("mic").onclick=()=>toggleMic();
  }
}
function advance(){ if(state.pos>=N-1){ view="send"; confirmNext=false; flushDraft(); render(); window.scrollTo(0,0); } else go(state.pos+1); }
function pick(b,v){
  const a=state.answers[b.id]=state.answers[b.id]||{};
  a.v=v; confirmNext=false; flushDraft(); render();
  if(v!=="ok"){ const t=$("ta"); if(t && !t.value){ t.focus({preventScroll:true}); t.scrollIntoView({block:"center"}); } }
}
function renderList(sc){
  setTop("Список блоков");
  let html=`<h1 class="title2">Список блоков</h1><div class="legend">● серый — нет ответа; <b style="color:#2e8b57">●</b> зелёный — принято; <b style="color:#b03a2a">●</b> красный — не принято; <b style="color:#b8960f">●</b> жёлтый — нужно уточнить.</div>
  <button type="button" class="big small" id="lBack" style="margin-bottom:12px">Вернуться к блоку</button><div>`;
  let lastSec=null;
  REVIEW.forEach((b,i)=>{
    const sec=b.section||"";
    if(sec!==lastSec){ html+=`<div class="li hd">${esc(sec)}</div>`; lastSec=sec; }
    const s=status(b.id);
    const nm=(b.type==="term"?b.number+". ":b.type==="quiz"?"Вопрос "+b.number+". ":b.type==="quickstart"?b.number+". ":"")+b.title.replace(/\*+/g,"");
    html+=`<button type="button" class="li ${i===state.pos?"cur":""}" data-i="${i}"><span class="dot ${s}"></span><span>${esc(nm)}</span><span class="st">${s==="ok"?"принято":s==="bad"?"не принято":s==="unsure"?"уточнить":"нет ответа"}</span></button>`;
  });
  sc.innerHTML=html+`</div><div class="foot"><button type="button" class="big dark" id="lSend">Закончить и отправить</button></div>`;
  $("lBack").onclick=()=>{ view="block"; render(); window.scrollTo(0,0); };
  $("lSend").onclick=()=>{ view="send"; render(); window.scrollTo(0,0); };
  sc.querySelectorAll(".li[data-i]").forEach(x=>x.onclick=()=>go(+x.dataset.i));
}
function renderSend(sc,c){
  setTop("Отправка");
  const thanks = state.sent && !sc.dataset.fresh;
  sc.innerHTML=`<h1 class="title2">Отправка</h1>
   ${state.sent?`<div class="thanks"><h2>Спасибо, правки отправлены</h2><p>Отправка № ${state.sent}. Если захотите что-то дополнить, вернитесь к блокам, внесите изменения и отправьте ещё раз: в отправку войдут все ваши ответы.</p></div>`:""}
   <div class="sum"><div><span>Принято</span><b>${c.ok}</b></div><div><span>Не принято</span><b>${c.bad}</b></div><div><span>Нужно уточнить</span><b>${c.unsure}</b></div><div><span>Без ответа</span><b>${c.none}</b></div></div>
   <label class="lbl" for="name">Ваше имя</label>
   <input class="f" id="name" placeholder="Например, Фирая Ярхамовна" autocomplete="name" value="${esc(state.name||"")}">
   <div class="err" id="sErr" role="alert"></div>
   <button type="button" class="big dark" id="sGo" style="min-height:96px;font-size:1.3rem">${state.sent?"ОТПРАВИТЬ ДОПОЛНЕНИЯ":"ОТПРАВИТЬ ПРАВКИ"}</button>
   <div id="sFail"></div>
   <div class="nav" style="flex-direction:column;margin-top:18px">
     <button type="button" class="big" id="sUn">${c.none?"Вернуться к непроверенным":"Вернуться к блокам"}</button>
     <button type="button" class="big small" id="sList">Список блоков</button></div>`;
  $("name").addEventListener("input",e=>{ state.name=e.target.value; saveDraft(); });
  $("sUn").onclick=()=>{ const i=REVIEW.findIndex(b=>status(b.id)==="none"); go(i>=0?i:0); };
  $("sList").onclick=()=>{ view="list"; render(); window.scrollTo(0,0); };
  $("sGo").onclick=doSend;
}
$("mList").onclick=()=>{ view="list"; render(); window.scrollTo(0,0); };
$("mSend").onclick=()=>{ view="send"; render(); window.scrollTo(0,0); };

/* ===== голос ===== */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function micNote(msg){ const n=$("micNote"); if(!n) return; n.textContent=msg; n.classList.toggle("hidden",!msg); }
function stopMic(){ try{ rec&&rec.stop(); }catch(e){} rec=null; }
function toggleMic(){
  const btn=$("mic"), ta=$("ta"); if(!btn||!ta) return;
  if(!SR){ micNote("В этом браузере диктовка не работает. Откройте страницу в Chrome или Safari. Или нажмите на клавиатуре телефона значок микрофона и говорите прямо в поле. Можно и печатать."); return; }
  if(rec){ stopMic(); return; }
  try{
    const r=new SR(); rec=r; r.lang="ru-RU"; r.continuous=true; r.interimResults=true;
    const base=ta.value; let fin="";
    r.onresult=ev=>{
      let interim="";
      for(let i=ev.resultIndex;i<ev.results.length;i++){ const x=ev.results[i]; if(x.isFinal) fin+=x[0].transcript+" "; else interim+=x[0].transcript; }
      ta.value=(base?base.replace(/\s*$/," "):"")+fin+interim; ta.dispatchEvent(new Event("input",{bubbles:true}));
    };
    r.onerror=ev=>{ micNote(ev.error==="not-allowed"||ev.error==="service-not-allowed"
      ?"Нет доступа к микрофону. Нажмите на значок замка слева от адреса страницы, выберите «Микрофон» и «Разрешить», затем нажмите «Надиктовать» ещё раз. Или просто печатайте."
      :ev.error==="no-speech"?"Ничего не слышно. Нажмите «Надиктовать» и говорите ближе к микрофону."
      :"Диктовка не получилась. Нажмите «Надиктовать» ещё раз или печатайте текст."); };
    r.onend=()=>{ const b=$("mic"); if(b){ b.classList.remove("rec"); b.textContent="🎤 Надиктовать"; } if(rec===r) rec=null; };
    r.start(); btn.classList.add("rec"); btn.textContent="Остановить диктовку"; micNote("Говорите. Текст появится в поле выше.");
  }catch(err){ micNote("Диктовка недоступна. Можно печатать текстом."); rec=null; btn.classList.remove("rec"); }
}

/* ===== отправка ===== */
function buildPayload(){
  const items=[]; const c=counts();
  REVIEW.forEach(b=>{
    const a=state.answers[b.id]; if(!a || (!a.v && !(a.text||"").trim())) return;
    items.push({id:b.id, type:b.type, number:b.number||null, title:b.title, section:b.section,
      verdict:a.v||"comment", text:(a.text||"").trim(), source:(a.source||"").trim(), part:(b.type==="term"?(a.part||""):"")});
  });
  const stats={total:c.all, ok:c.ok, bad:c.bad, unsure:c.unsure, unchecked:c.none, version:(state.sent||0)+1, client_id:cid, ua:navigator.userAgent.slice(0,120)};
  return {expert_name:(state.name||"").trim(), items, stats, status:"new"};
}
async function doSend(){
  stopMic();
  const p=buildPayload(), s=p.stats;
  $("sErr").textContent=""; $("sFail").innerHTML="";
  if(!p.items.length){ $("sErr").textContent="Пока нет ни одного ответа. Вернитесь к блокам и выберите ответ."; return; }
  if(!p.expert_name){ $("sErr").textContent="Напишите, пожалуйста, ваше имя."; $("name").focus(); return; }
  const btn=$("sGo"); btn.disabled=true; btn.textContent="Отправляю…";
  try{ await sendPayload(p); state.sent=s.version; flushDraft(); render(); window.scrollTo(0,0);
    if(DEMO){ $("sErr").textContent="Пробный режим: файл с правками сохранён на компьютер."; $("sErr").style.color="#111"; } }
  catch(err){
    const ofl = err && err.message==="auth";
    btn.disabled=false; btn.textContent=state.sent?"ОТПРАВИТЬ ДОПОЛНЕНИЯ":"ОТПРАВИТЬ ПРАВКИ";
    $("sFail").innerHTML=`<div class="soft"><b>Не удалось отправить.</b> ${ofl?"Время входа истекло. Войдите заново: всё сохранено.":"Нет связи или ошибка. Ваши ответы сохранены на этом устройстве. Попробуйте ещё раз или скачайте файл и передайте его Ильдару."}
      <div class="row">${ofl?`<button type="button" class="big small dark" id="fRe">Войти заново</button>`:""}<button type="button" class="big small" id="fDl">Скачать файл с правками</button></div></div>`;
    $("fDl").onclick=()=>download(p);
    if($("fRe")) $("fRe").onclick=()=>{ lsDel(LS.sess); showApp(false); };
  }
}
function download(p){
  const blob=new Blob([JSON.stringify(Object.assign({created_at:new Date().toISOString()},p),null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`slovar_review_${new Date().toISOString().slice(0,10)}_v${p.stats.version}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
async function sendPayload(p){
  if(DEMO){ download(p); return; }
  const token=await getToken(); if(!token) throw new Error("auth");
  const r=await fetch(SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/"+TABLE,{method:"POST",
    headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+token,"Content-Type":"application/json",Prefer:"return=minimal"},
    body:JSON.stringify({expert_name:p.expert_name,items:p.items,stats:p.stats})});
  if(r.status===401||r.status===403) throw new Error("auth");
  if(!r.ok) throw new Error("http "+r.status);
}
