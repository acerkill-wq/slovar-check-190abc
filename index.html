<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Проверка «Словаря сметчика»</title>
<style>
:root{--ink:#111;--muted:#333;--cream:#fbf6e4;--grey:#ebebeb;--line:#555;--ok:#1b5a38;--bad:#7d2a1c;--wait:#f2dd8c;--waitink:#3d2f00}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:22px;-webkit-text-size-adjust:100%}
body{font:400 1rem/1.6 Arial,Verdana,sans-serif;color:var(--ink);background:#fff;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid #000;outline-offset:3px}
.hidden{display:none!important}
mark{background:#ffe98a;padding:0 3px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
/* вход */
#login{padding:28px 0 60px}
#login img{height:44px;width:auto;display:block;margin-bottom:36px}
#login h1{font-size:1.6rem;line-height:1.25;margin-bottom:14px}
#login p{margin-bottom:20px}
label.lbl{display:block;font-weight:700;margin:0 0 8px}
.f{width:100%;border:3px solid #333;background:#fff;padding:14px 16px;font-size:1rem;line-height:1.5;border-radius:6px}
input.f{min-height:72px}
textarea.f{font-size:1rem;min-height:9.5rem;resize:vertical}
.err{color:#8a1b0d;font-weight:700;margin:12px 0;min-height:1.6em}
.hint-login{margin-top:16px;color:var(--muted)}
.demo-note{border:3px solid #333;padding:12px 16px;margin-bottom:20px;background:#fff3b8}
.big{display:block;width:100%;min-height:76px;border:3px solid #000;background:#fff;font-weight:700;font-size:1.1rem;padding:12px 18px;border-radius:6px;cursor:pointer;text-align:center;line-height:1.3}
.big.dark{background:#000;color:#fff}
.big.dark:disabled{opacity:.6}
.big.small{min-height:64px;font-size:1rem}
.link{background:none;border:0;border-bottom:2px solid #000;font-size:.9rem;padding:8px 2px;min-height:48px;cursor:pointer;font-weight:700}
/* верхняя строка */
.top{border-bottom:3px solid #000;padding:12px 0 14px}
.top .r1{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top img{height:36px;width:auto;display:block}
.fs{display:flex;align-items:center;gap:6px;font-size:.8rem}
.fs button{min-width:52px;min-height:52px;border:3px solid #000;background:#fff;font-weight:700;cursor:pointer;border-radius:6px;font-size:1rem}
.top .cnt{font-weight:700;font-size:1.15rem;margin-top:10px}
.top .prog{font-size:.9rem;margin:2px 0 8px}
.bar{height:16px;border:2px solid #000;background:#fff}
.bar i{display:block;height:100%;background:#333}
.top .menu{display:flex;gap:22px;flex-wrap:wrap;margin-top:6px}
/* блок */
.q{background:var(--cream);padding:26px 22px;margin-top:22px;border:2px solid #cfc7a8}
.q .kind{font-size:.85rem;color:var(--muted);margin-bottom:4px}
.q h1{font-size:1.7rem;line-height:1.25;margin-bottom:16px}
.fld{margin-bottom:18px}
.fl{font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.02em}
.fv{font-family:Georgia,"Times New Roman",serif;font-size:1.07rem;line-height:1.6}
.box{padding:16px 18px;margin-bottom:16px;border:2px solid}
.box .bl{font-size:.95rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px}
.box.off{background:#efefef;border-color:#b5b5b5}
.box.off .fv.quote{font-style:italic}
.box.off .src{margin-top:10px;font-family:Arial,Verdana,sans-serif;font-style:normal;font-size:.9rem;color:#222}
.box.pl{background:#fffdf0;border-color:#d8cc8c}
.box.ex{background:#fff;border-color:#d4cdb0}
.part{border:0;margin:14px 0 4px}
.part legend{font-weight:700;margin-bottom:8px;font-size:1.05rem}
.part label{display:flex;align-items:center;gap:14px;min-height:64px;border:3px solid #333;border-radius:6px;background:#fff;padding:10px 16px;margin-bottom:10px;cursor:pointer;font-size:1.05rem}
.part input{width:28px;height:28px;flex:0 0 28px;accent-color:#000}
.part label.on{background:#000;color:#fff}
.hint{background:#ffe98a;border:3px solid #7a6200;padding:14px 16px;margin-top:20px;font-size:1rem}
.a{background:var(--grey);padding:24px 22px;margin-top:22px;border:2px solid #bdbdbd}
.a .lead{font-weight:700;margin-bottom:12px}
.v{display:block;width:100%;min-height:84px;font-size:1.1rem;font-weight:700;border:4px solid;border-radius:6px;cursor:pointer;padding:12px 16px;margin-bottom:14px;background:#fff;line-height:1.3}
.v.ok{border-color:var(--ok);color:var(--ok)}
.v.bad{border-color:var(--bad);color:var(--bad)}
.v.unsure{border-color:#6b5500;color:var(--waitink);min-height:68px;font-size:1rem}
.v.on.ok{background:var(--ok);color:#fff}
.v.on.bad{background:var(--bad);color:#fff}
.v.on.unsure{background:var(--wait);outline:4px solid #000;outline-offset:-4px}
.v.on{box-shadow:none;outline:4px solid #000;outline-offset:3px}
.panel{margin-top:10px;padding-top:16px;border-top:2px solid #999}
.panel h2{font-size:1.15rem;margin-bottom:10px}
.mic{margin-top:14px;display:block;width:100%;min-height:72px;font-size:1.05rem;font-weight:700;border:3px solid #000;background:#fff;border-radius:6px;cursor:pointer}
.mic.rec{background:#000;color:#fff}
.mic-note{margin-top:10px;padding:12px 14px;border:3px solid #333;background:#fff;font-size:1rem}
.panel .src{margin-top:18px}
.nav{display:flex;gap:14px;margin:24px 0 10px}
.nav .big{flex:1}
.soft{border:3px solid #000;background:#fff;padding:18px;margin-top:10px}
.soft .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.soft .row .big{flex:1;min-width:210px}
.foot{padding:20px 0 60px}
/* список */
.title2{font-size:1.5rem;margin:22px 0 14px}
.legend{font-size:.85rem;margin-bottom:14px}
.li{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;text-align:left;background:#fff;border:0;border-bottom:1px solid #999;padding:10px 4px;cursor:pointer;font-size:.95rem}
.li .dot{flex:0 0 22px;height:22px;border-radius:50%;border:2px solid #000;background:#bbb}
.li .dot.ok{background:#2e8b57}.li .dot.bad{background:#b03a2a}.li .dot.unsure{background:#e8c93d}
.li .st{color:var(--muted);font-size:.8rem;margin-left:auto;flex:0 0 auto}
.li.cur{background:var(--cream);font-weight:700}
.li.hd{font-weight:700;background:#f3f3f3;min-height:48px;cursor:default;font-size:.85rem}
/* отправка */
.sum{border:3px solid #000;padding:6px 18px;margin:16px 0 24px}
.sum div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #aaa;font-size:1.05rem}
.sum div:last-child{border-bottom:0}
.thanks{border:4px solid var(--ok);padding:24px 20px;margin:22px 0;background:#f1f7f3}
.thanks h2{font-size:1.6rem;margin-bottom:8px}
@media(max-width:480px){.wrap{padding:0 14px}.q,.a{padding:20px 16px}.q h1{font-size:1.5rem}}
</style>
</head>

/*DATA_START*/const BOOK={"book":"Словарь сметчика","source":"10_текст_v4_корр.md","version":"v4_корр","blocks":[{"id":"title","type":"title","section":"Обложка","title":"Словарь сметчика","text":"100 главных слов профессии простым языком. Для тех, кто пришёл не из стройки","review":false},{"id":"intro","type":"intro","section":"Вступление","title":"Как пользоваться словарём","text":"Представьте: Вам прислали первую в жизни смету. Вы открываете файл, а там ГЭСН, ВОР, КС-2, НР, СП. Строчки ровные, цифры серьёзные, а Вы читаете и не понимаете, с какого слова вообще начинать.\n\nЗнакомое чувство? Оно есть у каждого, кто приходил в профессию не из стройки. И у тех, кто пришёл из стройки, оно тоже было: просто в первый месяц, а не в первый день.\n\nХорошая новость: за этими сокращениями стоят простые вещи. Этот словарь объясняет их обычными словами и короткими примерами из рабочих будней сметчика. Термины идут по темам, в том порядке, в котором Вы встретите их в профессии: от «кто есть кто на стройке» до «как смета попадает на экспертизу».\n\n**Как устроено каждое слово.** Сначала официальное определение из закона или приказа с указанием источника: так Вы привыкаете к языку документов, с которым будете работать. Под ним «Простыми словами»: то же самое по-человечески. В конце «Пример» из жизни сметчика. Когда в нормативных документах отдельного определения нет, мы так и пишем и не подставляем свои слова под видом официальных.\n\n**Как читать:**\n1. Начните со страницы «Быстрый старт»: 10 слов, с которых начинается любая смета. Отметьте, какие знаете, а какие хотите разобрать.\n2. Проверьте себя в квизе из 5 вопросов: он занимает одну страницу, а ответы лежат на обороте.\n3. Остальные 90 слов откройте тогда, когда встретите их в смете. Найдите слово в оглавлении, прочитайте определение, объяснение и пример. Учить наизусть не нужно.","callout":"**Нет строительного образования? Это не помеха.** В профессию сметчика приходят люди из самых разных сфер, и главному здесь учатся: считать по правилам и объяснять свой расчёт.","review":true},{"id":"quick_intro","type":"quickstart_intro","section":"Быстрый старт","title":"Быстрый старт: 10 слов, с которых начинается любая смета","text":"Эти слова Вы встретите в первой же смете. Отметьте рядом с каждым: **знаю** или **хочу разобраться**. Официальные формулировки и подробности по каждому слову лежат в основном словаре, номер указан в скобках.","review":false},{"id":"qs01","type":"quickstart","section":"Быстрый старт","number":1,"term_ref":1,"title":"Смета","plain":"расчёт цены работ до того, как они начались. По нему заказчик понимает, сколько нужно денег, а подрядчик, что именно он делает за эту цену.","checkboxes":"☐ Знаю ☐ Хочу разобраться","review":true},{"id":"qs02","type":"quickstart","section":"Быстрый старт","number":2,"term_ref":22,"title":"ВОР, ведомость объёмов работ","plain":"список работ с количеством каждой: что делаем и в каком объёме. Ошибка в ВОР тянется через всю смету, поэтому сметчик начинает с неё.","checkboxes":"☐ Знаю ☐ Хочу разобраться","review":true},{"id":"qs03","type":"quickstart","section":"Быстрый старт","number":3,"term_ref":38,"title":"ГЭСН","plain":"нормы, в которых написано, сколько труда, времени работы машин и материалов уходит на единицу работы. Рублей в них нет: цены подставляют отдельно.","checkboxes":"☐ Знаю ☐ Хочу разобраться","review":true},{"id":"qs04","type":"quickstart","section":"Быстрый старт","number":4,"term_ref":55,"title":"РИМ, ресурсно-индексный метод","plain":"способ расчёта сметы: нормы ГЭСН плюс цены ресурсов из ФГИС ЦС в текущем уровне. Там, где такой цены нет, берут базисную цену и применяют индекс по группе ресурсов. По РИМ сейчас считают большинство новых смет.","checkboxes":"☐ Знаю ☐ Хочу разобраться","review":true,"hint":"Это то же слово, что термин № 55 (РИМ). Подходит ли короткое объяснение?"},{"id":"qs05","type":"quickstart","section":"Быстрый старт","number":5,"term_ref":47,"title":"ФСНБ","plain":"федеральная сметная нормативная база: нормы и сметные цены, на которые опирается сметчик. Действующая версия называется ФСНБ-2022.","checkboxes":"☐ Знаю ☐ Хочу разобраться","review":true},{"id":"qs06","type":"quickstart","section":"Быстрый старт","number":6,"term_ref":82,"title":"КС-2","plain":"акт о том, что подрядчик выполнил и заказчик принял. Он отвечает на вопрос «что сделано за период».","checkboxes":"☐ Знаю ☐ Хочу разобраться","review":true},{"id":"qs07","type":"quickstart","section":"Быстрый старт","number":7,"term_ref":93,"title":"НМЦК","plain":"начальная (максимальная) цена контракта: больше неё заказчик платить не готов. Для стройки её обосновывают сметой.","checkboxes":"☐ Знаю ☐ Хочу разобраться","review":true},{"id":"qs08","type":"quickstart","section":"Быстрый старт","number":8,"term_ref":30,"title":"ССР, сводный сметный расчёт","plain":"итог по всей стройке: в него складываются все сметы по объектам и прочие затраты. Увидели «сводный»? Значит, перед Вами полная стоимость.","checkboxes":"☐ Знаю ☐ Хочу разобраться","review":true},{"id":"qs09","type":"quickstart","section":"Быстрый старт","number":9,"term_ref":68,"title":"НР, накладные расходы","plain":"расходы подрядчика на то, чтобы стройка шла: управление, охрана труда, содержание офиса. Их считают процентом от фонда оплаты труда.","checkboxes":"☐ Знаю ☐ Хочу разобраться","review":true},{"id":"qs10","type":"quickstart","section":"Быстрый старт","number":10,"term_ref":100,"title":"ГРАНД-Смета","plain":"сметная программа, основной инструмент учебного курса КНС. В ней сметчик собирает смету из норм, цен и объёмов.","checkboxes":"☐ Знаю ☐ Хочу разобраться","review":true,"hint":"«Основной инструмент учебного курса КНС»: так ли это на самом деле?"},{"id":"quick_cta","type":"cta","section":"Быстрый старт","title":"Приглашение на эфир","text":"**Хочется увидеть, как эти 10 слов складываются в одну строку сметы?** Покажем на эфире «Быстрый старт 2026»: [КОРОТКАЯ_ССЫЛКА]","review":true},{"id":"quiz_intro","type":"quiz_intro","section":"Квиз","title":"Квиз на 5 вопросов: проверьте, что запомнили","text":"Ответы ищите в словаре: они лежат в определениях и примерах. Отметьте один вариант в каждом вопросе. Проверить себя можно на обороте.","review":false},{"id":"quiz1","type":"quiz","section":"Квиз","number":1,"title":"Вопрос 1","question":"Норма рассчитана на 100 м², а в смете 250 м². Сколько измерителей нужно взять?","options":"А. 250  Б. 2,5  В. 25","answer_letter":"Б","answer_text":"250 м² ÷ 100 м² = 2,5 измерителя (термин № 43).","review":true},{"id":"quiz2","type":"quiz","section":"Квиз","number":2,"title":"Вопрос 2","question":"С какого документа начинается смета?","options":"А. Со справки КС-3  Б. С ведомости объёмов работ (ВОР)  В. С НМЦК","answer_letter":"Б","answer_text":"Ведомость объёмов работ: с неё начинается смета (термин № 22).","review":true},{"id":"quiz3","type":"quiz","section":"Квиз","number":3,"title":"Вопрос 3","question":"От какой величины считают накладные расходы и сметную прибыль?","options":"А. От стоимости материалов  Б. От итога сметы  В. От фонда оплаты труда (ФОТ)","answer_letter":"В","answer_text":"Накладные расходы и сметную прибыль считают от ФОТ (термины № 68, № 69).","review":true},{"id":"quiz4","type":"quiz","section":"Квиз","number":4,"title":"Вопрос 4","question":"Какой документ отвечает на вопрос «сколько за выполненные работы платить»?","options":"А. Справка КС-3  Б. Акт освидетельствования скрытых работ  В. Пояснительная записка","answer_letter":"А","answer_text":"Справка КС-3: по ней заказчик оплачивает работы (термин № 83).","review":true},{"id":"quiz5","type":"quiz","section":"Квиз","number":5,"title":"Вопрос 5","question":"Какой документ собирает итог по всей стройке?","options":"А. Локальный сметный расчёт  Б. Объектный сметный расчёт  В. Сводный сметный расчёт (ССР)","answer_letter":"В","answer_text":"Сводный сметный расчёт: итог по всей стройке (термин № 30).","review":true},{"id":"quiz_result","type":"quiz_result","section":"Квиз","title":"Результат квиза","text":"**Результат:**\n- **0–3 верных ответа.** Вы в начале пути, и это хорошая точка: все слова впереди, и ни одно не страшное.\n- **4–5 верных ответов.** Осталось собрать слова в одну картину.\n\n**Хотите увидеть эту картину целиком?** Покажем на эфире «Быстрый старт 2026»: [КОРОТКАЯ_ССЫЛКА]","review":true},{"id":"sec1","type":"section","section":"Раздел 1. Профессия и участники стройки","number":1,"title":"Профессия и участники стройки","text":"*Кто есть кто на стройке и где в этой картине Вы.* Термины 1–14","review":false},{"id":"t001","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":1,"title":"Смета","official":"в нормативных документах отдельного определения слова «смета» нет. Ближайшее: «Сметная стоимость строительства определяется сметой на строительство, реконструкцию, капитальный ремонт объекта капитального строительства, разрабатываемой в составе проектной документации […]»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 4.","plain":"расчёт, из чего и за сколько построят или отремонтируют объект. В нём записано, какие нужны работы, сколько их и по какой цене.","example":"смета на ремонт квартиры показывает цену каждой работы, от снятия обоев до покраски потолка, и общий итог.","onwork":"","cta_line":"","review":true},{"id":"t002","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":2,"title":"Инженер-сметчик","official":"в нормативных документах отдельного определения нет, «инженер-сметчик» — разговорное название. Ближайшее: цель вида деятельности в профстандарте «Специалист по сметному ценообразованию на этапе архитектурно-строительного проектирования»: «Определение сметной стоимости строительства, реконструкции, капитального ремонта, сноса объектов капитального строительства, работ по сохранению объектов культурного наследия (памятников истории и культуры) народов Российской Федерации на этапе архитектурно-строительного проектирования»","source_official":"Приказ Минтруда России от 11.03.2024 № 97н, раздел I.","plain":"специалист, который считает стоимость строительства и ремонта и проверяет чужие сметы. Работает у подрядчика, у заказчика, в проектной организации или сам на себя.","example":"подрядчик получил проект школы: сметчик считает, сколько стоят работы, и отвечает на вопросы заказчика по расчёту.","onwork":"","cta_line":"","review":true},{"id":"t003","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":3,"title":"Заказчик","official":"в Градостроительном кодексе единого определения нет. Ближайшее, роль заказчика в подряде: «По договору подряда одна сторона (подрядчик) обязуется выполнить по заданию другой стороны (заказчика) определенную работу и сдать ее результат заказчику, а заказчик обязуется принять результат работы и оплатить его.»","source_official":"ГК РФ, ст. 702, п. 1.","plain":"тот, кто заказывает работы, платит за них и принимает результат. Им бывает государство, компания или частное лицо. На стройке заказчиком часто называют застройщика или технического заказчика.","example":"управление образования заказывает ремонт школы и принимает выполненные работы по актам.","onwork":"","cta_line":"","review":true},{"id":"t004","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":4,"title":"Застройщик","official":"«физическое или юридическое лицо, обеспечивающее на принадлежащем ему земельном участке или на земельном участке иного правообладателя […] строительство, реконструкцию, капитальный ремонт, снос объектов капитального строительства […]. Застройщик вправе передать свои функции, предусмотренные законодательством о градостроительной деятельности, техническому заказчику»","source_official":"ГрК РФ, ст. 1, п. 16.","plain":"тот, кто отвечает за то, чтобы объект появился: организует проект и стройку на своём участке или, когда ему передали такое право, на чужом. Часть своих задач он может поручить техническому заказчику.","example":"компания строит жилой дом на своём участке и сама отвечает за то, чтобы дом появился.","onwork":"","cta_line":"","review":true},{"id":"t005","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":5,"title":"Технический заказчик","official":"«юридическое лицо, которое уполномочено застройщиком и от имени застройщика заключает договоры о выполнении инженерных изысканий, о подготовке проектной документации, о строительстве, реконструкции, капитальном ремонте, сносе объектов капитального строительства, подготавливает задания на выполнение указанных видов работ, […]»","source_official":"ГрК РФ, ст. 1, п. 22.","plain":"организация, которой застройщик поручил вести стройку от своего имени: договариваться с проектировщиками и подрядчиками, готовить задания, подписывать документы.","example":"застройщик нанял технического заказчика: тот выдаёт задание проектировщикам и принимает работы у подрядчиков.","onwork":"","cta_line":"","review":true},{"id":"t006","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":6,"title":"Подрядчик","official":"в нормативных документах отдельного определения нет. Ближайшее: «По договору строительного подряда подрядчик обязуется в установленный договором срок построить по заданию заказчика определенный объект либо выполнить иные строительные работы, […]»","source_official":"ГК РФ, ст. 740, п. 1.","plain":"тот, кто выполняет работы по договору с заказчиком и отвечает за их результат.","example":"бригада по договору делает отделку офиса и отвечает за её качество.","onwork":"","cta_line":"","review":true},{"id":"t007","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":7,"title":"Генеральный подрядчик (генподрядчик)","official":"«подрядчик вправе привлечь к исполнению своих обязательств других лиц (субподрядчиков). В этом случае подрядчик выступает в роли генерального подрядчика.»","source_official":"ГК РФ, ст. 706, п. 1.","plain":"главный подрядчик на объекте. Он привлекает субподрядчиков и перед заказчиком отвечает за их работу как за свою.","example":"генподрядчик строит торговый центр, а договоры на кровлю и вентиляцию подписывает с отдельными компаниями.","onwork":"","cta_line":"","review":true},{"id":"t008","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":8,"title":"Субподрядчик","official":"в нормативных документах отдельного определения нет, термин вводится в скобках. Ближайшее: «подрядчик вправе привлечь к исполнению своих обязательств других лиц (субподрядчиков)»","source_official":"ГК РФ, ст. 706, п. 1.","plain":"компания, которую генподрядчик нанимает на отдельные виды работ: электрику, кровлю, вентиляцию.","example":"генподрядчик строит школу, а электромонтаж в ней выполняет субподрядчик-электрик.","onwork":"","cta_line":"","review":true},{"id":"t009","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":9,"title":"Проектная организация","official":"в нормативных документах отдельного определения нет. Ближайшее, кто вправе готовить проект: «Работы по договорам о подготовке проектной документации, […] должны выполняться только индивидуальными предпринимателями или юридическими лицами, которые являются членами саморегулируемых организаций в области архитектурно-строительного проектирования, если иное не предусмотрено настоящей статьей.»","source_official":"ГрК РФ, ст. 48, ч. 4.","plain":"компания, которая по заданию заказчика готовит проект: чертежи, расчёты и сметы. Как правило, она состоит в саморегулируемой организации (СРО) в области проектирования.","example":"проектная организация выпускает чертежи детского сада и сметы к ним.","onwork":"","cta_line":"","review":true},{"id":"t010","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":10,"title":"Строительный контроль (технадзор)","official":"«Строительный контроль проводится в процессе строительства, реконструкции, капитального ремонта объектов капитального строительства в целях проверки соответствия выполняемых работ проектной документации […]»","source_official":"ГрК РФ, ст. 53, ч. 1.","plain":"проверка по ходу стройки, что работы выполняют по проекту, по нормам и с нужным качеством. Её проводит тот, кто строит (подрядчик), а при подряде ещё застройщик или технический заказчик. Государственный строительный надзор — отдельная проверка со стороны государства на объектах, проект которых подлежит экспертизе. «Технадзором» в разговоре называют и то и другое, поэтому полезно уточнять, о ком речь.","example":"контролёр смотрит, что арматуру уложили по чертежу, до того как залили бетон.","onwork":"","cta_line":"","review":true},{"id":"t011","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":11,"title":"Объект капитального строительства","official":"«здание, строение, сооружение, объекты, строительство которых не завершено (далее — объекты незавершенного строительства), за исключением некапитальных строений, сооружений и неотделимых улучшений земельного участка (замощение, покрытие и другие)»","source_official":"ГрК РФ, ст. 1, п. 10.","plain":"здание или сооружение, прочно связанное с землёй: переместить его без серьёзного ущерба нельзя. К таким объектам относится и незавершённое строительство. Киоски и навесы сюда не входят.","example":"жилой дом, школа, склад — объекты капитального строительства, а торговый киоск и навес — нет.","onwork":"","cta_line":"","review":true,"hint":"Определение из ГрК с незавершённым строительством, а киоски и навесы названы некапитальными. Верно ли это для новичка?"},{"id":"t012","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":12,"title":"Реконструкция","official":"«изменение параметров объекта капитального строительства, его частей (высоты, количества этажей, площади, объема), в том числе надстройка, перестройка, расширение объекта капитального строительства, […]»","source_official":"ГрК РФ, ст. 1, п. 14.","plain":"изменение параметров объекта: высоты, числа этажей, площади, объёма. Сюда относятся надстройка и расширение, а также замена несущих конструкций.","example":"надстроили этаж или пристроили новое крыло.","onwork":"","cta_line":"","review":true},{"id":"t013","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":13,"title":"Капитальный ремонт","official":"«замена и (или) восстановление строительных конструкций объектов капитального строительства или элементов таких конструкций, за исключением несущих строительных конструкций, замена и (или) восстановление систем инженерно-технического обеспечения и сетей инженерно-технического обеспечения объектов капитального строительства или их элементов, […]»","source_official":"ГрК РФ, ст. 1, п. 14.2.","plain":"замена и восстановление конструкций здания, его инженерных систем и сетей. Параметры здания (площадь, этажность, объём) при этом остаются прежними. Несущие конструкции целиком не заменяют (это уже реконструкция): можно заменить их отдельные элементы на такие же или лучше.","example":"замена кровли, лифтов и всех труб в доме.","onwork":"","cta_line":"","review":true},{"id":"t014","type":"term","section":"Раздел 1. Профессия и участники стройки","section_number":1,"number":14,"title":"Текущий ремонт","official":"в Градостроительном кодексе определения нет. Ближайшее: «Техническое обслуживание зданий, сооружений, текущий ремонт зданий, сооружений проводятся в целях обеспечения надлежащего технического состояния таких зданий, сооружений.»","source_official":"ГрК РФ, ст. 55.24, ч. 8.","plain":"работы, которые поддерживают объект в рабочем состоянии: покраска, замена отдельных элементов, устранение неисправностей.","example":"в подъезде покрасили стены и поменяли дверной блок.","onwork":"","cta_line":"","review":true},{"id":"c1_1","type":"remember","section":"Раздел 1. Профессия и участники стройки","section_number":1,"title":"Плашка «Запомните»","text":"**Запомните.** Один и тот же объект у разных участников стройки «живёт» в разных документах. Сметчик встречается со всеми ними, поэтому первым делом выясняет: кто здесь заказчик, а кто подрядчик.","review":true},{"id":"end1","type":"section_end","section":"Раздел 1. Профессия и участники стройки","section_number":1,"title":"Конец раздела 1: фраза «Как это слово звучит на работе»","onwork":"Начальник говорит: «Сначала выясни, кто у нас заказчик и кто генподрядчик, а потом берись за смету».","cta_line":"*Покажем, как это слово работает в смете: эфир «Быстрый старт 2026», [КОРОТКАЯ_ССЫЛКА]*","review":true},{"id":"sec2","type":"section","section":"Раздел 2. Проект и исходные документы","number":2,"title":"Проект и исходные документы","text":"*Откуда сметчик берёт объёмы: что открыть, что посчитать, где искать.* Термины 15–27","review":false},{"id":"t015","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":15,"title":"Проектно-сметная документация (ПСД)","official":"в нормативных документах отдельного определения нет, «ПСД» в Градостроительном кодексе не встречается. Ближайшее: «Архитектурно-строительное проектирование осуществляется путем подготовки проектной документации, рабочей документации […]»","source_official":"ГрК РФ, ст. 48, ч. 1.","plain":"привычное название полного комплекта: проект (чертежи, пояснения, расчёты) вместе со сметой. В законе документацию делят на проектную и рабочую, а смета входит в проектную отдельным разделом.","example":"папка с чертежами, расчётами и сметой на детский сад — это и есть ПСД.","onwork":"","cta_line":"","review":true},{"id":"t016","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":16,"title":"Проектная документация (стадия «П»)","official":"«Проектная документация представляет собой документацию, содержащую материалы в текстовой и графической формах и (или) в форме информационной модели и определяющую архитектурные, функционально-технологические, конструктивные и инженерно-технические решения для обеспечения строительства, реконструкции объектов капитального строительства, их частей, капитального ремонта.»","source_official":"ГрК РФ, ст. 48, ч. 2.","plain":"документы с основными решениями по объекту: что строим, из чего и какие системы. Её, как правило, проверяют на экспертизе.","example":"в проектной документации записано, что здание кирпичное с плоской кровлей, а как именно вести кладку, покажут рабочие чертежи.","onwork":"","cta_line":"","review":true},{"id":"t017","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":17,"title":"Рабочая документация (стадия «Р», РД)","official":"«Рабочая документация представляет собой документацию, содержащую материалы в текстовой и графической формах и (или) в форме информационной модели, в соответствии с которой осуществляются строительство, реконструкция объекта капитального строительства, их частей. Рабочая документация разрабатывается на основании проектной документации.»","source_official":"ГрК РФ, ст. 48, ч. 2.1.","plain":"подробные чертежи, по которым строители ведут работы на площадке. Их готовят на основании проектной документации.","example":"чертёж армирования плиты перекрытия с шагом стержней — это рабочая документация.","onwork":"","cta_line":"","review":true},{"id":"t018","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":18,"title":"Разделы (марки) проекта","official":"в нормативных документах отдельного определения нет, есть перечень разделов. Ближайшее: «В состав проектной документации для строительства объектов капитального строительства производственного и непроизводственного назначения, […] в обязательном порядке включаются следующие разделы: а) раздел 1 „Пояснительная записка“; б) раздел 2 „Схема планировочной организации земельного участка“; в) раздел 3 „Объемно-планировочные и архитектурные решения“; г) раздел 4 „Конструктивные решения“; […]»","source_official":"Постановление Правительства РФ от 16.02.2008 № 87, п. 3(1).","plain":"части проекта по направлениям: архитектура, конструкции, отопление и вентиляция, водопровод и канализация, электрика. На чертежах их обозначают буквами-марками, например АР и ВК; расшифровку смотрят в общих данных проекта.","example":"окна сметчик ищет в разделе АР, а трубы водопровода в разделе ВК.","onwork":"","cta_line":"","review":true},{"id":"t019","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":19,"title":"Техническое задание (ТЗ)","official":"в строительстве официальное название другое — «задание на проектирование». Ближайшее: «заказчик обязан передать подрядчику задание на проектирование, а также иные исходные данные, необходимые для составления технической документации.»","source_official":"ГК РФ, ст. 759, п. 1.","plain":"описание того, что нужно сделать и каким должен быть результат. В договоре с проектировщиком его называют «заданием на проектирование». Сметчику иногда дают ТЗ вместо полного проекта: тогда объёмы берут из задания и замеров.","example":"«Заменить окна в классах и покрасить коридор»: так выглядит ТЗ в одну строку, а объёмы сметчик замеряет на месте.","onwork":"","cta_line":"","review":true},{"id":"t020","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":20,"title":"Экспликация помещений","official":"в нормативных документах отдельного определения нет. Ближайшее: проектная документация содержит «поэтажные планы зданий и сооружений с приведением экспликации помещений — для объектов непроизводственного назначения»","source_official":"Постановление Правительства РФ от 16.02.2008 № 87, п. 13.","plain":"таблица помещений с их назначением и площадями. По ней удобно считать отделку.","example":"в экспликации кабинет указан площадью 18 м²: по этой цифре считают линолеум на пол (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t021","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":21,"title":"Спецификация","official":"в нормативных документах отдельного определения нет. Ближайшее, область применения стандарта: «Настоящий стандарт устанавливает форму и общие правила выполнения спецификации оборудования, изделий и материалов в составе рабочей документации для строительства объектов различного назначения.»","source_official":"ГОСТ 21.110-2013, п. 1.","plain":"таблица материалов и оборудования из проекта: что нужно и в каком количестве.","example":"строка из спецификации: «Светильник потолочный, 24 шт.» (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t022","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":22,"title":"Ведомость объёмов работ (ВОР)","official":"в нормативных документах отдельного определения нет. Ближайшее: «Сметные расчеты разрабатываются на основании проектной и (или) иной технической документации, результатов инженерных изысканий, ведомостей объемов работ с указанием наименований работ, их единиц измерения и объемов работ, […]»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 35.","plain":"перечень всех работ с их количеством: что делаем и в каком объёме. С него начинается смета, а ошибка в нём тянется через весь расчёт.","example":"«Штукатурка стен — 120 м²; окраска стен — 120 м²; стяжка — 45 м²» (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t023","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":23,"title":"Объём работ и подсчёт объёмов","official":"в нормативных документах отдельного определения нет. Ближайшее: «ведомостей объемов работ с указанием наименований работ, их единиц измерения и объемов работ, ссылок на чертежи и спецификации, расчета объемов работ и расхода материальных ресурсов (с приведением формул расчета)»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 35.","plain":"объём работ — это количество работы в единицах измерения: м², м³, м, шт., т. Подсчёт объёмов — определение этих количеств по чертежам или по замерам на объекте; одна из главных задач сметчика.","example":"периметр комнаты 14 м, высота 2,5 м: площадь стен 35 м² до вычета окон и дверей (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t024","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":24,"title":"Дефектная ведомость","official":"в законе такого термина нет, он говорит об акте. Ближайшее: смета на капитальный ремонт готовится «на основании акта, утвержденного застройщиком или техническим заказчиком и содержащего перечень дефектов оснований, строительных конструкций, систем инженерно-технического обеспечения и сетей инженерно-технического обеспечения с указанием качественных и количественных характеристик таких дефектов»","source_official":"ГрК РФ, ст. 48, ч. 12.2.","plain":"перечень найденных повреждений и работ, которые нужны, чтобы их устранить. На нём строят смету на ремонт, особенно когда полного проекта нет. В законе похожий документ называется «акт с перечнем дефектов».","example":"«Трещина в стяжке, 6 м²; отслоение штукатурки, 15 м²» (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t025","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":25,"title":"Проект организации строительства (ПОС)","official":"в нормативных документах отдельного определения нет. Ближайшее: «Раздел 7 „Проект организации строительства“ содержит: в текстовой части а) характеристику района по месту расположения объекта капитального строительства и условий строительства, реконструкции, капитального ремонта; […]»","source_official":"Постановление Правительства РФ от 16.02.2008 № 87, п. 23.","plain":"раздел проекта о том, как организуют стройку: сроки, этапы, техника, временные здания. Из него сметчик берёт сведения для затрат, которые идут в смете отдельными строками.","example":"в ПОС записано, что бетонируют в январе: сметчик понимает, что в смете нужно искать зимнее удорожание.","onwork":"","cta_line":"","review":true},{"id":"t026","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":26,"title":"Сметная документация","official":"в нормативных документах отдельного определения нет. Ближайшее, состав: «В составе сметной документации разрабатываются следующие сметные расчеты: а) сводка затрат (при необходимости); б) сводный сметный расчет стоимости строительства; в) объектные сметные расчеты (сметы); г) локальные сметные расчеты (сметы); д) сметные расчеты на отдельные виды затрат.»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 25.","plain":"весь комплект бумаг к смете: сметные расчёты, пояснительная записка, ведомости объёмов работ и документы, которые обосновывают цены.","example":"для экспертизы собрали локальные сметы, сводный расчёт, пояснительную записку и ведомости объёмов.","onwork":"","cta_line":"","review":true},{"id":"t027","type":"term","section":"Раздел 2. Проект и исходные документы","section_number":2,"number":27,"title":"Пояснительная записка к смете","official":"в нормативных документах отдельного определения нет. Ближайшее, содержание: «Пояснительная записка к сметной документации, […] содержит следующую информацию: а) сведения о месте расположения объекта капитального строительства; б) перечень примененных сметных нормативов, […]; г) обоснование особенностей определения сметной стоимости строительных работ для объекта капитального строительства; […]»","source_official":"Постановление Правительства РФ от 16.02.2008 № 87, п. 29.","plain":"текстовый документ о том, на чём построен расчёт: где находится объект, какие применены нормативы, чем обоснованы особенности расчёта. По нему проверяющий понимает, как считали.","example":"в записке указано, что смета составлена по РИМ, и перечислены применённые нормативы (условный пример).","onwork":"","cta_line":"","review":true},{"id":"c2_1","type":"mistake","section":"Раздел 2. Проект и исходные документы","section_number":2,"title":"Плашка «Типичная ошибка новичка»","text":"**Типичная ошибка новичка.** Обычно путают проектную документацию («П») и рабочую («Р»): первая отвечает на вопрос «что строим», вторая на вопрос «как именно делаем».","review":true},{"id":"end2","type":"section_end","section":"Раздел 2. Проект и исходные документы","section_number":2,"title":"Конец раздела 2: фраза «Как это слово звучит на работе»","onwork":"Коллега пишет: «Рабочую документацию прислали? Тогда ВОР собирай по ней, а не по эскизу».","cta_line":"*Покажем, как это слово работает в смете: эфир «Быстрый старт 2026», [КОРОТКАЯ_ССЫЛКА]*","review":true},{"id":"sec3","type":"section","section":"Раздел 3. Виды смет","number":3,"title":"Виды смет","text":"*От одной строки до итога по всей стройке: как смета собирается по этажам.* Термины 28–34","review":false},{"id":"t028","type":"term","section":"Раздел 3. Виды смет","section_number":3,"number":28,"title":"Локальный сметный расчёт (локальная смета)","official":"«Локальные сметные расчеты (сметы) разрабатываются на конструктивные решения и (или) комплексы (виды) работ в соответствии с технологической последовательностью выполнения работ и с учетом условий их выполнения.»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 36.","plain":"смета на один вид работ или одну часть объекта: отделку, кровлю, электромонтаж, фундаменты.","example":"локальный сметный расчёт на кровлю школы: только работы и материалы по кровле.","onwork":"","cta_line":"","review":true},{"id":"t029","type":"term","section":"Раздел 3. Виды смет","section_number":3,"number":29,"title":"Объектный сметный расчёт","official":"«Объектные сметные расчеты (сметы) разрабатываются на отдельные объекты капитального строительства и включают итоговые стоимостные показатели локальных сметных расчетов (смет). В случае, если сметная стоимость объекта капитального строительства определена по одному локальному сметному расчету (смете), то объектный сметный расчет (смета) может не разрабатываться.»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 39.","plain":"смета на целый объект (здание): складывает итоги его локальных смет. Когда на объект одна локальная смета, объектную можно не составлять.","example":"для школы есть локальные сметы на кровлю, отделку и электрику. Вместе они дают объектную смету на здание школы.","onwork":"","cta_line":"","review":true},{"id":"t030","type":"term","section":"Раздел 3. Виды смет","section_number":3,"number":30,"title":"Сводный сметный расчёт (ССР)","official":"«Сводный сметный расчет стоимости строительства разрабатывается на объект строительства и (или) этап строительства на основании итоговых стоимостных показателей объектных и (или) локальных сметных расчетов (смет), а также сметных расчетов на отдельные виды затрат.»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 40.","plain":"итоговый документ по всей стройке: собирает объектные сметы и прочие затраты в одну полную стоимость.","example":"в сводном расчёте по школе рядом стоят само здание, благоустройство, проектные работы и НДС.","onwork":"","cta_line":"","review":true},{"id":"t031","type":"term","section":"Раздел 3. Виды смет","section_number":3,"number":31,"title":"Главы сводного сметного расчёта","official":"в нормативных документах отдельного определения нет, Методика называет главы по их содержанию. Ближайшее: «В главу 9 сводного сметного расчета включается сметная стоимость прочих работ и затрат, не учитываемых в других главах сводного сметного расчета.»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 159.","plain":"разделы ССР, по которым распределены затраты. Всего 12 глав: от подготовки территории и основных объектов до временных зданий, прочих работ и затрат, а также проектных работ.","example":"временные здания лежат в главе 8, а прочие работы и затраты в главе 9.","onwork":"","cta_line":"","review":true},{"id":"t032","type":"term","section":"Раздел 3. Виды смет","section_number":3,"number":32,"title":"Ресурсная ведомость","official":"отдельного определения в нормативных документах нет; термин используется на практике.","source_official":"","plain":"сводка всех ресурсов по смете: сколько нужно труда, машин и материалов. Это название формы из сметных программ (ещё её называют ведомостью ресурсов), по ней удобно заказывать материалы.","example":"в ведомости видно, что на объект нужно 12 т цемента: по ней закупщик оформляет заказ (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t033","type":"term","section":"Раздел 3. Виды смет","section_number":3,"number":33,"title":"Укрупнённые нормативы цены строительства (НЦС)","official":"«укрупненный норматив цены строительства — показатель потребности в денежных средствах, необходимых для создания единицы мощности строительной продукции, предназначенный для планирования (обоснования) инвестиций (капитальных вложений) в объекты капитального строительства»","source_official":"ГрК РФ, ст. 1, п. 33.1.","plain":"готовые цены «за единицу мощности»: за 1 м² жилья, за километр сети. По ним оценивают бюджет объекта, пока нет проекта. Точную смету по НЦС не составляют.","example":"до проекта детский сад оценили так: площадь здания умножили на НЦС за 1 м². Получился ориентир бюджета, а не смета.","onwork":"","cta_line":"","review":true},{"id":"t034","type":"term","section":"Раздел 3. Виды смет","section_number":3,"number":34,"title":"Коммерческая смета","official":"в нормативных документах такого термина нет. Ближайшее, где заканчиваются обязательные правила: «Положения Методики применяются при определении сметной стоимости строительства объектов капитального строительства, финансируемого с привлечением средств бюджетов бюджетной системы Российской Федерации, […] и в иных случаях, если это предусмотрено федеральным законом или договором.»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 3.","plain":"смета по рыночным ценам без обязательных государственных правил. Её чаще составляют для частных заказчиков, а формат и цены стороны согласуют в договоре.","example":"владелец загородного дома просит смету на ремонт по рыночным ценам, и формат согласуют в договоре.","onwork":"","cta_line":"","review":true},{"id":"c3_1","type":"remember","section":"Раздел 3. Виды смет","section_number":3,"title":"Плашка «Запомните»","text":"**Запомните.** Смета собирается снизу вверх: локальные сметы → объектная → сводный расчёт. Видите «сводный»? Значит, перед Вами итог по всей стройке.","review":true},{"id":"end3","type":"section_end","section":"Раздел 3. Виды смет","section_number":3,"title":"Конец раздела 3: фраза «Как это слово звучит на работе»","onwork":"Начальник говорит: «Локалки готовы? Тогда свожу их в объектную, а потом в сводный».","cta_line":"*Покажем, как это слово работает в смете: эфир «Быстрый старт 2026», [КОРОТКАЯ_ССЫЛКА]*","review":true},{"id":"cta_mid","type":"cta","section":"Раздел 3","title":"Блок-приглашение после раздела 3","text":"### Вы уже знаете, из каких частей собирается смета\nОсталось увидеть, как эти части складываются в одну строку: ВОР → ГЭСН → шифр → НР. На эфире **«Быстрый старт 2026»** эксперты Академии покажут это на экране, шаг за шагом.\n**Записаться на эфир:** [КОРОТКАЯ_ССЫЛКА]","review":true},{"id":"sec4","type":"section","section":"Раздел 4. Нормативы: на что опирается сметчик","number":4,"title":"Нормативы: на что опирается сметчик","text":"*Сметчик не придумывает цифры: он опирается на нормы. Вот на какие.* Термины 35–50","review":false},{"id":"t035","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":35,"title":"Сметные нормативы","official":"«сметные нормативы — сметные нормы и методики, необходимые для определения сметной стоимости строительства, стоимости работ по инженерным изысканиям и по подготовке проектной документации, а также методики разработки и применения сметных норм»","source_official":"ГрК РФ, ст. 1, п. 33.","plain":"официальные нормы и методики, по которым считают смету. Их утверждает Минстрой, а сведения о них включены в федеральный реестр.","example":"сборник норм и методика определения сметной стоимости — это сметные нормативы.","onwork":"","cta_line":"","review":true},{"id":"t036","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":36,"title":"Федеральный реестр сметных нормативов (ФРСН)","official":"«Федеральный реестр сметных нормативов, содержащий сведения об утвержденных сметных нормативах, размещается в федеральной государственной информационной системе ценообразования в строительстве.»","source_official":"ГрК РФ, ст. 8.4, ч. 2.","plain":"государственный реестр утверждённых сметных нормативов: что действует, какие изменения внесены и что применять уже нельзя. Он размещён во ФГИС ЦС. Сметчик сверяется с ним, прежде чем взять документ в работу.","example":"перед началом работы сметчик открывает реестр и проверяет, что нужный сборник норм действует.","onwork":"","cta_line":"","review":true},{"id":"t037","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":37,"title":"Сметные нормы","official":"«сметные нормы — совокупность количественных показателей материалов, изделий, конструкций и оборудования, затрат труда работников в строительстве, времени эксплуатации машин и механизмов (далее — строительные ресурсы), установленных на принятую единицу измерения, и иных затрат, применяемых при определении сметной стоимости строительства»","source_official":"ГрК РФ, ст. 1, п. 31.","plain":"показывают, сколько труда, работы машин и материалов нужно на единицу работы. О деньгах в них речи нет.","example":"норма отвечает на вопрос: сколько человеко-часов и какое количество раствора нужно на 100 м² штукатурки.","onwork":"","cta_line":"","review":true},{"id":"t038","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":38,"title":"ГЭСН","official":"в нормативных документах расшифровки нет, аббревиатура вводится так: «сметные нормы на строительные работы (далее — ГЭСН)»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 8.","plain":"государственные элементные сметные нормы: основной набор сборников норм на строительные работы. В них только количество труда, машин и материалов, рублей в них нет.","example":"открыли сборник ГЭСН, нашли «штукатурка стен» и увидели, сколько нужно человеко-часов, машинного времени и материалов. Цен в строке нет.","onwork":"","cta_line":"","review":true,"hint":"ГЭСН: расшифровка «государственные элементные сметные нормы» дана только в «Простыми словами», а в «Официально» цитата Методики. Верно ли?"},{"id":"t039","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":39,"title":"ГЭСНр","official":"«сметные нормы на ремонтно-строительные работы (далее — ГЭСНр)»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 8.","plain":"нормы на ремонтно-строительные работы: ремонт полов, кровли, штукатурки и т. д.","example":"замену покрытия пола в старом здании ищут в ГЭСНр.","onwork":"","cta_line":"","review":true},{"id":"t040","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":40,"title":"ГЭСНм","official":"«сметные нормы на монтаж оборудования (далее — ГЭСНм)»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 8.","plain":"нормы на монтаж оборудования: станков, насосов, лифтов, вентиляционных установок.","example":"монтаж насоса в котельной ищут в ГЭСНм.","onwork":"","cta_line":"","review":true},{"id":"t041","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":41,"title":"Сборник норм","official":"отдельного определения в нормативных документах нет; термин используется на практике.","source_official":"","plain":"нормы разбиты на сборники по видам работ, у каждого сборника свой номер и свой шифр. Шифр сборника читается по частям: например, в 81-02-08 первое число означает государственные нормативы, второе — строительные работы, а третье — номер сборника.","example":"ГЭСН 01 — земляные работы, ГЭСН 15 — отделочные работы.","onwork":"","cta_line":"","review":true,"hint":"Шифр сборника расшифрован по частям (81-02-08: государственные нормативы, строительные работы, номер сборника). Подтверждаете?"},{"id":"t042","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":42,"title":"Шифр (код) нормы","official":"отдельного определения в нормативных документах нет; в образце локальной сметы по Методике 421/пр есть реквизит строки «шифр сметной нормы».","source_official":"","plain":"номер конкретной нормы, как адрес строки в сборнике, например 15-01-070-01. По нему любой специалист найдёт ту же строку и проверит смету. Не путайте с шифром сборника: тот называет сборник целиком, а шифр нормы указывает на одну строку внутри него.","example":"эксперт увидел в смете шифр, открыл сборник и за минуту сверил норму с расчётом.","onwork":"","cta_line":"","review":true,"hint":"Шифр нормы показан как адрес строки (15-01-070-01), части шифра не расшифровываются. Верно ли разведены шифр сборника и шифр нормы?"},{"id":"t043","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":43,"title":"Измеритель","official":"в нормативных документах приведено так: «выбор единицы измерения разрабатываемой сметной нормы (далее — Измеритель)»","source_official":"Приказ Минстроя России от 18.07.2022 № 577/пр (Методика разработки сметных норм), п. 11.","plain":"единица, на которую рассчитана норма. Часто это не 1 м², а 100 м² или 1 т, и на этом новички ошибаются.","example":"норма дана на 100 м², в смете 250 м²: в расчёте это 2,5 измерителя (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t044","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":44,"title":"Единичная расценка","official":"в нормативных документах отдельного определения нет. Ближайшее: «Смета на строительство разрабатывается с использованием сметных нормативов, а также единичных расценок и их отдельных составляющих, […]»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 7.","plain":"готовая стоимость единицы работы: труд, машины и материалы уже посчитаны в ценах на определённую дату. В ресурсно-индексном методе считают по нормам и ценам ресурсов, а не по расценкам.","example":"расценка на 100 м² штукатурки сразу показывает, сколько стоят труд, машины и материалы вместе.","onwork":"","cta_line":"","review":true},{"id":"t045","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":45,"title":"ФЕР","official":"«федеральные единичные расценки на строительные работы (далее — ФЕР)»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 8.","plain":"федеральные единичные расценки: готовые цены на единицу работы в базисных ценах (для ФЕР-2001 это цены на 1 января 2000 года). Их применяют в базисно-индексном методе.","example":"расценка ФЕР на стяжку пола показывает цену по уровню 2000 года, а до сегодняшнего дня её доводят индексом.","onwork":"","cta_line":"","review":true},{"id":"t046","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":46,"title":"ТЕР","official":"«территориальные единичные расценки на строительные работы (далее — ТЕР)»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 8.","plain":"территориальные единичные расценки: как ФЕР, только разработаны и утверждены в регионе с учётом местных условий. Они тоже в базисных ценах, а не в сегодняшних.","example":"сметчик в регионе берёт расценку из региональной базы, а не из федеральной.","onwork":"","cta_line":"","review":true},{"id":"t047","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":47,"title":"ФСНБ","official":"отдельного определения в нормативных документах нет; термин используется на практике.","source_official":"","plain":"федеральная сметная нормативная база: набор государственных нормативов для расчёта смет. Сейчас применяют ФСНБ-2022: в неё входят нормы (ГЭСН) и сметные цены на материалы и работу машин. Базу регулярно дополняют пакетами изменений.","example":"сметчик открывает ФСНБ-2022 и берёт из неё и норму на работу, и цену материала.","onwork":"","cta_line":"","review":true},{"id":"t048","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":48,"title":"ФСБЦ и ФСЭМ","official":"«сборник сметных цен на материальные ресурсы и оборудование в базисном уровне цен по состоянию на 1 января 2022 г. (далее — ФСБЦ-2022)» и «сборник сметных цен на эксплуатацию машин и механизмов в базисном уровне цен по состоянию на 1 января 2022 г. (далее — ФСЭМ-2022)»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 10.","plain":"федеральные сборники сметных цен: ФСБЦ содержит цены на материалы, изделия и конструкции, ФСЭМ — на эксплуатацию машин и механизмов. Оба входят в ФСНБ-2022, цены в них даны в базисном уровне на 1 января 2022 года.","example":"цену кирпича в смете берут из ФСБЦ, а цену часа работы экскаватора из ФСЭМ.","onwork":"","cta_line":"","review":true},{"id":"t049","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":49,"title":"Сметные цены строительных ресурсов","official":"«сметные цены строительных ресурсов — сводная агрегированная в территориальном разрезе документированная информация о стоимости строительных ресурсов, установленная расчетным путем на принятую единицу измерения и размещаемая в федеральной государственной информационной системе ценообразования в строительстве»","source_official":"ГрК РФ, ст. 1, п. 32.","plain":"официальные цены на материалы, работу машин, оборудование и труд. Их публикуют во ФГИС ЦС по регионам и ставят в смету.","example":"цену цемента для своего региона сметчик берёт в базе, а не в объявлении на сайте.","onwork":"","cta_line":"","review":true},{"id":"t050","type":"term","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"number":50,"title":"Методика 421/пр","official":"«Методика определения сметной стоимости строительства, реконструкции, капитального ремонта, сноса объектов капитального строительства, […] (далее — Методика) определяет единые методы формирования сметной стоимости строительства, […] на этапе архитектурно-строительного проектирования, подготовки сметы на снос объекта капитального строительства.»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 1.","plain":"приказ Минстроя с правилами определения сметной стоимости: главный документ о том, как считать смету. Для бюджетных объектов он обязателен, а для остальных применяется тогда, когда так записано в законе или в договоре. Он действует с изменениями, поэтому сметчик всегда сверяет актуальную редакцию.","example":"возник спор, как считать накладные расходы: сметчик открывает методику и находит нужный пункт.","onwork":"","cta_line":"","review":true},{"id":"c4_1","type":"remember","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"title":"Плашка «Запомните»","text":"**Запомните.** ГЭСН: нормы без рублей, в них только количество труда, машин и материалов. ФЕР и ТЕР: готовые расценки в базисных ценах (для ФЕР-2001 это 1 января 2000 года).","review":true},{"id":"end4","type":"section_end","section":"Раздел 4. Нормативы: на что опирается сметчик","section_number":4,"title":"Конец раздела 4: фраза «Как это слово звучит на работе»","onwork":"Коллега просит: «Шифр нормы пиши в каждой строке, иначе эксперт не найдёт, откуда цифра».","cta_line":"*Покажем, как это слово работает в смете: эфир «Быстрый старт 2026», [КОРОТКАЯ_ССЫЛКА]*","review":true},{"id":"sec5","type":"section","section":"Раздел 5. Методы расчёта и цены","number":5,"title":"Методы расчёта и цены","text":"*Один объём можно посчитать разными способами. Разберём, какими и зачем.* Термины 51–60","review":false},{"id":"t051","type":"term","section":"Раздел 5. Методы расчёта и цены","section_number":5,"number":51,"title":"Строительные ресурсы","official":"отдельного определения нет, термин вводится в определении сметных норм: «материалов, изделий, конструкций и оборудования, затрат труда работников в строительстве, времени эксплуатации машин и механизмов (далее — строительные ресурсы)»","source_official":"ГрК РФ, ст. 1, п. 31.","plain":"всё, из чего складывается стоимость любой работы: труд рабочих, работа машин и материалы. В нормах ГЭСН написано, сколько каждого ресурса нужно, а в сметных ценах ФСНБ — сколько он стоит.","example":"для укладки плитки ресурсы такие: плиточник (труд), плиткорез (машина), плитка и клей (материалы).","onwork":"","cta_line":"","review":true,"hint":"Для этого слова вместо «определения нет» взята цитата из ГрК РФ (ст. 1, п. 31). Согласны ли Вы с таким решением?"},{"id":"t052","type":"term","section":"Раздел 5. Методы расчёта и цены","section_number":5,"number":52,"title":"Базисный уровень цен","official":"«сметные цены на эксплуатацию машин и механизмов и на материальные ресурсы и оборудование, применяемые в строительстве в базисном уровне цен, сложившемся на определенную дату (далее — базисный уровень цен)»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 8.","plain":"цены на зафиксированную дату в прошлом, в которых заложены нормативы. Для расценок ФЕР-2001 это 1 января 2000 года, для сметных цен ФСНБ-2022 — 1 января 2022 года. До сегодняшнего дня такие цены доводят индексами.","example":"запись «в ценах 2000 года» означает базисный уровень.","onwork":"","cta_line":"","review":true},{"id":"t053","type":"term","section":"Раздел 5. Методы расчёта и цены","section_number":5,"number":53,"title":"Текущий уровень цен","official":"«Сметная стоимость строительства определяется в уровне цен, сложившемся ко времени составления сметной документации (далее — текущий уровень цен)»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 9.","plain":"цены на дату, на которую составляют смету. В РИМ их берут из ФГИС ЦС, а там, где текущей цены нет, переводят базисную цену индексом; в БИМ индексом переводят цены расценок.","example":"смета на октябрь 2026 года показывает цены этого периода, а не цены 2000 года.","onwork":"","cta_line":"","review":true},{"id":"t054","type":"term","section":"Раздел 5. Методы расчёта и цены","section_number":5,"number":54,"title":"Базисно-индексный метод (БИМ)","official":"«базисно-индексным методом — с применением к сметной стоимости строительства, определенной с использованием единичных расценок и их отдельных составляющих, сведения о которых включены в ФРСН, разработанных в базисном уровне цен, соответствующих индексов изменения сметной стоимости […]»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 10.","plain":"смету считают в «старых» базисных ценах и переводят в сегодняшние индексом. Сейчас так считают лишь в отдельных случаях, а какие именно, определяют нормативные акты, поэтому их стоит сверять.","example":"расценку в ценах 2000 года умножили на индекс и получили цену на сегодня.","onwork":"","cta_line":"","review":true},{"id":"t055","type":"term","section":"Раздел 5. Методы расчёта и цены","section_number":5,"number":55,"title":"Ресурсно-индексный метод (РИМ)","official":"«ресурсно-индексным методом — с использованием сметных норм, сметных цен строительных ресурсов в базисном уровне цен и одновременным применением сметных цен строительных ресурсов в текущем уровне цен, информации об индексах изменения сметной стоимости строительства по группам однородных строительных ресурсов […]»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 10.","plain":"смету считают по нормам ГЭСН. Цены ресурсов берут из ФГИС ЦС в текущем уровне, а когда текущей цены ресурса там нет, берут базисную цену (для ФСНБ-2022 на 1 января 2022 года) и применяют индекс по группе однородных ресурсов, а не один индекс на всю смету. К началу 2024 года все регионы перешли на РИМ, поэтому новые проекты, как правило, считают по нему.","example":"норма на кладку стен даёт список ресурсов. Для кирпича в ФГИС ЦС есть цена текущего квартала, её и берут. Для раствора текущей цены нет: берут цену 2022 года и применяют индекс его группы (условный пример).","onwork":"","cta_line":"","review":true,"hint":"Три места. 1) «К началу 2024 года все регионы перешли на РИМ»: опора на письмо Минстроя без номера и даты. Верно ли так сказать или смягчить? 2) Верно ли, что в РИМ цены ресурсов берут из ФГИС ЦС в текущем уровне, а при их отсутствии применяют базисную цену и индекс по группе однородных ресурсов (ГОСР)? 3) Подходит ли пример с кирпичом и раствором?"},{"id":"t056","type":"term","section":"Раздел 5. Методы расчёта и цены","section_number":5,"number":56,"title":"Индекс изменения сметной стоимости","official":"«индексы изменения сметной стоимости строительства — показатели, которые применяются при определении сметной стоимости строительства, определяются как частное от деления цен строительных ресурсов и иных затрат, сложившихся ко времени определения сметной стоимости строительства, на базисный уровень цен таких строительных ресурсов (сопоставимых по номенклатуре строительных ресурсов) и иных затрат […]»","source_official":"Постановление Правительства РФ от 23.12.2016 № 1452, п. 2 Правил.","plain":"коэффициент, который переводит цену из одного периода в другой: цена сегодня, делённая на цену в базисном уровне. Индексы публикуют каждый квартал.","example":"в базисно-индексном методе при индексе 9 работа, стоившая 1 000 ₽ в базисных ценах 2000 года, в текущих ценах оценивается в 9 000 ₽ (условные цифры).","onwork":"","cta_line":"","review":true},{"id":"t057","type":"term","section":"Раздел 5. Методы расчёта и цены","section_number":5,"number":57,"title":"Группа однородных строительных ресурсов (ГОСР)","official":"«группа однородных строительных ресурсов — совокупность строительных ресурсов, имеющих схожие технические характеристики и динамику изменения стоимостных показателей»","source_official":"Постановление Правительства РФ от 23.12.2016 № 1452, п. 2 Правил.","plain":"набор похожих материалов или машин, у которых и характеристики, и динамика цены похожи. Для такой группы ФГИС ЦС публикует один индекс, и в РИМ его применяют там, где нет текущей цены.","example":"вместо отдельного индекса на каждую позицию в смете берут один индекс на группу похожих материалов.","onwork":"","cta_line":"","review":true},{"id":"t058","type":"term","section":"Раздел 5. Методы расчёта и цены","section_number":5,"number":58,"title":"ФГИС ЦС","official":"краткого определения в нормативных документах нет. Ближайшее: Положение «определяет порядок создания и эксплуатации федеральной государственной информационной системы ценообразования в строительстве (далее — информационная система), требования к программным и техническим средствам […]»","source_official":"Постановление Правительства РФ от 23.09.2016 № 959, п. 1 Положения.","plain":"государственная информационная система ценообразования в строительстве. В ней лежат сметные нормативы, классификатор ресурсов, сметные цены и индексы.","example":"нужен индекс на квартал: сметчик открывает ФГИС ЦС и находит его там.","onwork":"","cta_line":"","review":true},{"id":"t059","type":"term","section":"Раздел 5. Методы расчёта и цены","section_number":5,"number":59,"title":"Классификатор строительных ресурсов (КСР)","official":"«классификатор строительных ресурсов — систематизированный перечень используемых при строительстве объектов капитального строительства материалов, изделий, конструкций, оборудования, машин и механизмов, каждому из которых присвоен определенный код, гармонизированный с Общероссийским классификатором продукции по видам экономической деятельности, который формируется Министерством строительства и жилищно-коммунального хозяйства Российской Федерации и размещается в федеральной государственной информационной системе ценообразования в строительстве»","source_official":"Постановление Правительства РФ от 23.12.2016 № 1452, п. 2 Правил.","plain":"справочник материалов, машин и оборудования, у каждого свой код. Цен в самом классификаторе нет: по коду сметчик находит ресурс, а его цену смотрит в другом разделе ФГИС ЦС.","example":"у кирпича в классификаторе свой код: по нему сметчик находит цену ресурса в базе.","onwork":"","cta_line":"","review":true},{"id":"t060","type":"term","section":"Раздел 5. Методы расчёта и цены","section_number":5,"number":60,"title":"Конъюнктурный анализ","official":"«При отсутствии в ФГИС ЦС данных о сметных ценах в базисном или текущем уровне цен на отдельные материальные ресурсы и оборудование, а также сметных нормативов на отдельные виды работ и услуг допускается определение их сметной стоимости по наиболее экономичному варианту, определенному на основании сбора информации о текущих ценах (далее — конъюнктурный анализ).»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 13.","plain":"способ найти цену, которой нет во ФГИС ЦС: собирают сопоставимые ценовые предложения, как правило не менее трёх, и выбирают наиболее экономичный вариант по правилам методики. Предложением может быть коммерческое предложение (КП), прайс или счёт. Для НМЦК правило другое: его читают в методике отдельно.","example":"нужного светильника нет в базе. Запрашивают КП у трёх поставщиков, сравнивают сопоставимые позиции и выбирают цену по правилам методики.","onwork":"","cta_line":"","review":true},{"id":"c5_1","type":"mistake","section":"Раздел 5. Методы расчёта и цены","section_number":5,"title":"Плашка «Типичная ошибка новичка»","text":"**Типичная ошибка новичка.** Обычно путают «базисный» и «текущий» уровень цен. Базисный — это цены из прошлого, в которых написана норма. Текущий — это цены на день расчёта.","review":true},{"id":"end5","type":"section_end","section":"Раздел 5. Методы расчёта и цены","section_number":5,"title":"Конец раздела 5: фраза «Как это слово звучит на работе»","onwork":"Начальник говорит: «Эту смету считаем по РИМ. Цены возьми из ФГИС ЦС за текущий квартал, а где их нет, применяй индексы по группам ресурсов».","cta_line":"*Покажем, как это слово работает в смете: эфир «Быстрый старт 2026», [КОРОТКАЯ_ССЫЛКА]*","review":true},{"id":"sec6","type":"section","section":"Раздел 6. Из чего состоит стоимость","number":6,"title":"Из чего состоит стоимость","text":"*Цена любой строки в смете складывается из знакомых слагаемых. Разложим по полочкам.* Термины 61–76","review":false},{"id":"t061","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":61,"title":"Прямые затраты (ПЗ)","official":"«Прямые затраты учитывают сметную стоимость материалов, изделий, конструкций (далее — материальные ресурсы), оплату труда рабочих, […] стоимость эксплуатации машин и механизмов, оплату труда рабочих, управляющих машинами (далее — машинисты), а также стоимость перевозки и погрузочно-разгрузочных работ, не относимых на стоимость материальных ресурсов.»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 6.","plain":"деньги на труд рабочих, работу техники и материалы, а также на перевозку, которая не вошла в цену материала. Оборудование считают отдельно.","example":"покрасили стену: оплата маляров, работа подъёмника и краска входят в прямые затраты.","onwork":"","cta_line":"","review":true},{"id":"t062","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":62,"title":"Оплата труда рабочих (ОТ)","official":"отдельного определения в нормативных документах нет; термин используется на практике.","source_official":"","plain":"зарплата строителей, которые выполняют работу. Её считают по нормам трудозатрат: сколько человеко-часов (чел.-ч) уходит на единицу работы, умноженных на цену часа.","example":"норма: 30 чел.-ч на участок. Умножили на стоимость часа и получили оплату труда рабочих (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t063","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":63,"title":"Фонд оплаты труда (ФОТ)","official":"«в процентах от размера средств на оплату труда (фонда оплаты труда, учитываемого в составе сметных прямых затрат, далее — ФОТ) рабочих — строителей, машинистов и пусконаладочного персонала (далее — рабочие, занятые в строительной отрасли)»","source_official":"Приказ Минстроя России от 11.12.2020 № 774/пр, п. 5.","plain":"оплата труда рабочих и машинистов вместе (в приказах к ним добавлен ещё пусконаладочный персонал). От неё считают накладные расходы и сметную прибыль.","example":"оплата труда рабочих 60 000 ₽, зарплата машинистов 10 000 ₽: ФОТ равен 70 000 ₽ (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t064","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":64,"title":"Эксплуатация машин и механизмов (ЭМ)","official":"отдельного определения в нормативных документах нет. Ближайшее: «Прямые затраты учитывают […] стоимость эксплуатации машин и механизмов, оплату труда рабочих, управляющих машинами (далее — машинисты), […]»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 6.","plain":"стоимость работы техники: кранов, экскаваторов, бетононасосов. Зарплату машиниста в смете показывают отдельной графой, и она тоже входит в ФОТ.","example":"экскаватор копает котлован: стоимость работы машины идёт в строку «эксплуатация машин», а зарплата машиниста — в свою графу.","onwork":"","cta_line":"","review":true,"hint":"«Зарплату машиниста в смете показывают отдельной графой, и она входит в ФОТ». Так ли это на курсе и в ГРАНД-Смете?"},{"id":"t065","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":65,"title":"Неучтённые материалы","official":"такого термина в Методике нет. Ближайшее: пункт 66 говорит о материальных ресурсах, «не учтенных в единичных расценках, расход которых зависит от проектных решений»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 66.","plain":"материалы, которых нет в составе нормы: их добавляют в смету отдельной строкой. «Неучтённые» — профессиональный жаргон, в документах говорят о ресурсах, не учтённых в норме или расценке.","example":"норма на облицовку плиткой может не включать саму плитку, и тогда плитку добавляют отдельной строкой.","onwork":"","cta_line":"","review":true},{"id":"t066","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":66,"title":"Оборудование","official":"общего определения в нормативных документах нет. Ближайшее, для инженерного оборудования: «К инженерному оборудованию в локальных сметных расчетах (сметах) относится оборудование, несущее функциональную нагрузку в здании или сооружении и обеспечивающее заданные параметры эксплуатации объекта капитального строительства […]»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 101.","plain":"то, что монтируют на объекте и что затем работает: котлы, насосы, лифты. Оборудование считают отдельно от монтажа: монтаж входит в прямые затраты.","example":"насос в котельной — оборудование, а его установка — работа, и считают их в разных строках.","onwork":"","cta_line":"","review":true},{"id":"t067","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":67,"title":"Транспортные затраты","official":"отдельного определения в нормативных документах нет. Ближайшее, в составе прямых затрат: «стоимость перевозки и погрузочно-разгрузочных работ, не относимых на стоимость материальных ресурсов»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 6.","plain":"затраты на доставку материалов и оборудования до объекта. В сметной цене ресурса транспорт может быть уже учтён, а может добавляться отдельной строкой: сначала проверяют, что включено в цену. На этом новички часто путаются.","example":"плитку везут на объект из другого города: сметчик сначала проверяет, учтена ли доставка в цене ресурса.","onwork":"","cta_line":"","review":true},{"id":"t068","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":68,"title":"Накладные расходы (НР)","official":"«накладные расходы, включающие в себя косвенные затраты, связанные с созданием общих условий строительного производства, его организацией, управлением, обслуживанием, включаемые в себестоимость строительства объектов капитального строительства»","source_official":"Приказ Минстроя России от 21.12.2020 № 812/пр, п. 2.","plain":"расходы подрядчика на то, чтобы стройка шла: управление, охрана труда, содержание офиса. Считаются процентом от ФОТ по нормативу для вида работ.","example":"ФОТ 100 000 ₽, норматив 90 %, накладные расходы 90 000 ₽ (условный пример; реальные нормативы смотрят в приказе).","onwork":"","cta_line":"","review":true,"hint":"Примеры в словаре про 90 % условные. Нормативы СП пересмотрены приказом 210/пр. Оставить так или заменить на явно учебные 10 % и 5 %?"},{"id":"t069","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":69,"title":"Сметная прибыль (СП)","official":"«сметная прибыль определяется в рублях и отражает усредненные по видам работ затраты строительных организаций, учитываемые в составе сметной стоимости строительства»","source_official":"Приказ Минстроя России от 11.12.2020 № 774/пр, п. 3.","plain":"нормативная прибыль подрядчика, которую закладывают в смету. Считается от ФОТ. Это норматив, а не обещание заработка: реальная прибыль зависит от цены договора.","example":"ФОТ 100 000 ₽, норматив 80 %, сметная прибыль 80 000 ₽ (условный пример; реальные нормативы смотрят в приказе).","onwork":"","cta_line":"","review":true,"hint":"Пример с 80 % условный. Нормативы СП пересмотрены приказом 210/пр. Оставить так или заменить на явно учебные цифры (10 % и 5 %)?"},{"id":"t070","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":70,"title":"Коэффициент к нормам","official":"«При разработке локальных сметных расчетов (смет) для учета усложняющих факторов и условий производства работ, указанных в проектной и (или) иной технической документации, используются коэффициенты к отдельным составляющим сметных норм (единичных расценок), приведенные в Приложении № 10 к Методике.»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 52.","plain":"поправка к расценке на особые условия: нормы рассчитаны на обычную работу, а на объекте она сложнее. Применяют только по документу, а не «на глаз».","example":"работа в тесном помещении: к норме применяют коэффициент, который указан в документе (условный пример).","onwork":"","cta_line":"","review":true},{"id":"t071","type":"term","section":"Раздел 6. Из чего состоит стоимость","section_number":6,"number":71,"title":"Условия производства работ","official":"отдельного определения в нормативных документах нет. Ближайшее: «Коэффициенты, учитывающие условия производства работ, обусловлены специфическими особенностями их выполнения на территории строительства, объекте капитального строительства или его части (выполнение работ в условиях эксплуатируемых зданий и сооружений, вблизи объектов, находящихся под электрическим напряжением, на территории действующих предприятий, имеющих разветвленную сеть транспортных и инженерных коммуникаций, стесненные условия для складирования материалов и прочие).»","source_official":"Приказ Минстроя России от 04.08.2020 № 421/пр, п. 54.","plain":"особенности места и условий, из-за которых работа дороже: действующее здание, стеснённые условия, работа вблизи электрооборудования под напряжением, на территории действующего предприятия. Их учитывают коэффициентами.","example":"ремонт в работающей больнице сложнее, чем в пустом здании, и это видно в смете.","onwork":"","cta_line
